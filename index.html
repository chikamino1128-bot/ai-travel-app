<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabiori風 旅行しおりアプリ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen text-gray-800 flex justify-center">

  <!-- アプリのメインコンテナ -->
  <div class="w-full max-w-md bg-slate-50 min-h-screen flex flex-col shadow-xl relative pb-20">

    <!-- ヘッダー -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
      <div class="flex justify-between items-center">
        <div>
          <h1 id="header-title" class="text-lg font-bold">旅行しおり</h1>
          <p id="header-subtitle" class="text-xs text-blue-100">旅の計画をみんなで共有</p>
        </div>
        <button onclick="switchTab('trips')" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-1.5 rounded-full flex items-center gap-1 transition">
          <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
          <span>旅行一覧</span>
        </button>
      </div>
    </header>

    <!-- メインコンテンツ表示エリア -->
    <main id="app-content" class="p-4 flex-1">
      <!-- JavaScriptでコンテンツが動的に描画されます -->
    </main>

    <!-- 下部固定ナビゲーションバー -->
    <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-200 py-2 px-3 flex justify-around text-xs z-20">
      <button onclick="switchTab('home')" id="tab-home" class="tab-btn flex flex-col items-center text-blue-600 font-bold">
        <i data-lucide="home" class="w-5 h-5 mb-0.5"></i>
        <span>ホーム</span>
      </button>
      <button onclick="switchTab('itinerary')" id="tab-itinerary" class="tab-btn flex flex-col items-center text-gray-400">
        <i data-lucide="calendar" class="w-5 h-5 mb-0.5"></i>
        <span>日程表</span>
      </button>
      <button onclick="switchTab('belongings')" id="tab-belongings" class="tab-btn flex flex-col items-center text-gray-400">
        <i data-lucide="check-square" class="w-5 h-5 mb-0.5"></i>
        <span>持ち物</span>
      </button>
      <button onclick="switchTab('settlement')" id="tab-settlement" class="tab-btn flex flex-col items-center text-gray-400">
        <i data-lucide="calculator" class="w-5 h-5 mb-0.5"></i>
        <span>割り勘</span>
      </button>
      <button onclick="switchTab('ai')" id="tab-ai" class="tab-btn flex flex-col items-center text-gray-400">
        <i data-lucide="sparkles" class="w-5 h-5 mb-0.5"></i>
        <span>AI解析</span>
      </button>
    </nav>

  </div>

  <script>
    // --- 初期データ ＆ ローカルストレージ管理 ---
    const DEFAULT_DATA = [
      {
        id: "trip-1",
        title: "東京観光旅行",
        dates: "2026/05/10 - 2026/05/11",
        members: ["あなた", "たろう", "はなこ"],
        itinerary: [
          { day: 1, time: "10:00", title: "東京駅集合", memo: "丸ノ内中央口で集合！" },
          { day: 1, time: "12:00", title: "浅草でランチ", memo: "天丼を食べる予定" },
          { day: 2, time: "11:00", title: "チームラボ豊洲", memo: "事前チケット購入済み" }
        ],
        belongings: [
          { id: 1, item: "新幹線のチケット", checked: true },
          { id: 2, item: "着替え（1泊分）", checked: false },
          { id: 3, item: "スマホ充電器", checked: false }
        ],
        expenses: [
          { id: 1, title: "新幹線代", amount: 15000, payer: "あなた" },
          { id: 2, title: "初日ランチ代", amount: 4500, payer: "たろう" }
        ]
      }
    ];

    function loadTrips() {
      const data = localStorage.getItem('tabiori_trips');
      if (!data) {
        localStorage.setItem('tabiori_trips', JSON.stringify(DEFAULT_DATA));
        return DEFAULT_DATA;
      }
      return JSON.parse(data);
    }

    function saveTrips() {
      localStorage.setItem('tabiori_trips', JSON.stringify(trips));
    }

    function getCurrentTrip() {
      return trips.find(t => t.id === currentTripId) || trips[0];
    }

    let trips = loadTrips();
    let currentTripId = trips[0] ? trips[0].id : null;

    // --- 1. ヘッダー更新 ---
    function updateHeader() {
      const trip = getCurrentTrip();
      const titleEl = document.getElementById('header-title');
      const subtitleEl = document.getElementById('header-subtitle');
      if (trip) {
        titleEl.innerText = trip.title;
        subtitleEl.innerText = trip.dates;
      } else {
        titleEl.innerText = "旅行しおり";
        subtitleEl.innerText = "旅行を作成・選択してください";
      }
    }

    // --- 2. 旅行切り替え・作成画面 ---
    function renderTrips() {
      return `
        <div class="space-y-4">
          <h2 class="text-md font-bold text-gray-700">旅行一覧</h2>
          <div class="space-y-2">
            ${trips.map(t => `
              <div onclick="selectTrip('${t.id}')" class="p-3 bg-white rounded-xl shadow-sm border ${t.id === currentTripId ? 'border-blue-500 bg-blue-50/30' : 'border-gray-100'} flex justify-between items-center cursor-pointer">
                <div>
                  <div class="font-bold text-sm text-gray-800">${t.title}</div>
                  <div class="text-xs text-gray-500">${t.dates}</div>
                </div>
                ${t.id === currentTripId ? '<span class="text-xs bg-blue-600 text-white px-2 py-0.5 rounded-full">選択中</span>' : ''}
              </div>
            `).join('')}
          </div>

          <div class="pt-4 border-t border-gray-200">
            <h3 class="text-xs font-bold text-gray-500 mb-2">新しい旅行を作成</h3>
            <div class="space-y-2">
              <input id="new-trip-title" type="text" placeholder="旅行タイトル（例: 沖縄リゾート旅）" class="w-full border rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
              <input id="new-trip-dates" type="text" placeholder="日程（例: 2026/08/01 - 2026/08/03）" class="w-full border rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
              <button onclick="createNewTrip()" class="w-full bg-blue-600 text-white text-xs py-2 rounded-lg font-bold shadow-sm hover:bg-blue-700">新規作成</button>
            </div>
          </div>
        </div>
      `;
    }

    function selectTrip(id) {
      currentTripId = id;
      switchTab('home');
    }

    function createNewTrip() {
      const title = document.getElementById('new-trip-title').value.trim();
      const dates = document.getElementById('new-trip-dates').value.trim();
      if (!title) return alert('タイトルを入力してください');

      const newTrip = {
        id: `trip-${Date.now()}`,
        title: title,
        dates: dates || "日程未定",
        members: ["あなた"],
        itinerary: [],
        belongings: [],
        expenses: []
      };

      trips.push(newTrip);
      currentTripId = newTrip.id;
      saveTrips();
      switchTab('home');
    }

    // --- 3. ホーム画面 ---
    function renderHome() {
      const trip = getCurrentTrip();
      if (!trip) return '<div class="text-center text-xs text-gray-400">旅行データがありません</div>';

      return `
        <div class="space-y-4">
          <div class="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-2xl p-4 text-white shadow-md">
            <div class="text-xs text-blue-100">ようこそ！</div>
            <div class="text-xl font-extrabold mt-1">${trip.title}</div>
            <div class="text-xs text-blue-100 mt-0.5">${trip.dates}</div>
            
            <div class="mt-4 pt-3 border-t border-white/20 flex justify-between items-center text-xs">
              <span>メンバー: ${trip.members.join(', ')}</span>
              <button onclick="shareTrip()" class="bg-white/20 hover:bg-white/30 px-2 py-1 rounded flex items-center gap-1">
                <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
                <span>共有</span>
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div onclick="switchTab('itinerary')" class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between cursor-pointer">
              <div class="flex items-center gap-2 text-blue-600">
                <i data-lucide="calendar" class="w-4 h-4"></i>
                <span class="text-xs font-bold">予定数</span>
              </div>
              <div class="text-xl font-bold text-gray-800 mt-2">${trip.itinerary.length} 件</div>
            </div>
            <div onclick="switchTab('belongings')" class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between cursor-pointer">
              <div class="flex items-center gap-2 text-indigo-600">
                <i data-lucide="check-square" class="w-4 h-4"></i>
                <span class="text-xs font-bold">持ち物</span>
              </div>
              <div class="text-xl font-bold text-gray-800 mt-2">
                ${trip.belongings.filter(b => b.checked).length} / ${trip.belongings.length}
              </div>
            </div>
          </div>

          <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-xs font-bold text-gray-500 mb-3">次の予定</h2>
            ${trip.itinerary.length > 0 ? `
              <div class="border-l-2 border-blue-500 pl-3 py-1">
                <div class="text-xs font-bold text-blue-600">${trip.itinerary[0].time}</div>
                <div class="text-sm font-bold text-gray-800">${trip.itinerary[0].title}</div>
                <div class="text-xs text-gray-500">${trip.itinerary[0].memo || 'メモなし'}</div>
              </div>
            ` : `
              <div class="text-xs text-gray-400 text-center py-2">予定がまだ登録されていません</div>
            `}
          </div>
        </div>
      `;
    }

    function shareTrip() {
      const trip = getCurrentTrip();
      const jsonStr = encodeURIComponent(JSON.stringify(trip));
      const shareUrl = `${window.location.origin}${window.location.pathname}?data=${jsonStr}`;
      
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("共有用URLをクリップボードにコピーしました！");
      }).catch(() => {
        alert("URLのコピーに失敗しました。");
      });
    }

    // --- 4. 日程表画面（元のレイアウト・項目を維持） ---
    function renderItinerary() {
      const trip = getCurrentTrip();
      if (!trip) return '';

      return `
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h2 class="text-sm font-bold text-gray-700">タイムスケジュール</h2>
          </div>

          <div class="space-y-3">
            ${trip.itinerary.map((item, idx) => `
              <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 relative">
                <div class="flex justify-between items-start">
                  <div class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${item.time}</div>
                  <button onclick="deleteItinerary(${idx})" class="text-gray-300 hover:text-red-500 text-xs px-1">✕</button>
                </div>
                <div class="text-sm font-bold text-gray-800 mt-1.5">${item.title}</div>
                ${item.memo ? `<div class="text-xs text-gray-500 mt-1 bg-gray-50 p-1.5 rounded">${item.memo}</div>` : ''}
              </div>
            `).join('')}
          </div>

          <div class="bg-white p-3 rounded-xl border border-dashed border-gray-300 space-y-2 mt-4">
            <div class="text-xs font-bold text-gray-600">予定を手動で追加</div>
            <div class="grid grid-cols-3 gap-2">
              <input id="add-time" type="time" class="border rounded-lg p-1.5 text-xs">
              <input id="add-title" type="text" placeholder="予定名" class="col-span-2 border rounded-lg p-1.5 text-xs">
            </div>
            <input id="add-memo" type="text" placeholder="メモ（場所や補足など）" class="w-full border rounded-lg p-1.5 text-xs">
            <button onclick="addItineraryItem()" class="w-full bg-blue-600 text-white text-xs py-2 rounded-lg font-bold">追加する</button>
          </div>
        </div>
      `;
    }

    function addItineraryItem() {
      const time = document.getElementById('add-time').value || "00:00";
      const title = document.getElementById('add-title').value.trim();
      const memo = document.getElementById('add-memo').value.trim();

      if (!title) return alert("予定名を入力してください");

      const trip = getCurrentTrip();
      trip.itinerary.push({ day: 1, time, title, memo });
      trip.itinerary.sort((a, b) => a.time.localeCompare(b.time));

      saveTrips();
      switchTab('itinerary');
    }

    function deleteItinerary(index) {
      const trip = getCurrentTrip();
      trip.itinerary.splice(index, 1);
      saveTrips();
      switchTab('itinerary');
    }

    // --- 5. 持ち物画面 ---
    function renderBelongings() {
      const trip = getCurrentTrip();
      if (!trip) return '';

      return `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-sm font-bold text-gray-700">持ち物チェックリスト</h2>
          </div>
          <div class="space-y-2">
            ${trip.belongings.map(b => `
              <label class="flex items-center justify-between text-sm p-2 hover:bg-gray-50 rounded border-b border-gray-50 last:border-none">
                <div class="flex items-center gap-2">
                  <input type="checkbox" ${b.checked ? 'checked' : ''} onchange="toggleBelonging(${b.id})" class="w-4 h-4 text-blue-600 rounded">
                  <span class="${b.checked ? 'line-through text-gray-400' : 'text-gray-700'}">${b.item}</span>
                </div>
                <button onclick="deleteBelonging(${b.id})" class="text-gray-300 hover:text-red-500 text-xs px-1">✕</button>
              </label>
            `).join('')}
          </div>
          <div class="flex gap-2 mt-4 pt-3 border-t">
            <input id="new-item-input" type="text" placeholder="新しい持ち物を追加" class="flex-1 border rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-blue-500">
            <button onclick="addBelonging()" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold">追加</button>
          </div>
        </div>
      `;
    }

    function toggleBelonging(id) {
      const trip = getCurrentTrip();
      const item = trip.belongings.find(b => b.id === id);
      if (item) {
        item.checked = !item.checked;
        saveTrips();
        switchTab('belongings');
      }
    }

    function addBelonging() {
      const input = document.getElementById('new-item-input');
      const text = input.value.trim();
      if (!text) return;
      const trip = getCurrentTrip();
      trip.belongings.push({ id: Date.now(), item: text, checked: false });
      saveTrips();
      switchTab('belongings');
    }

    function deleteBelonging(id) {
      const trip = getCurrentTrip();
      trip.belongings = trip.belongings.filter(b => b.id !== id);
      saveTrips();
      switchTab('belongings');
    }

    // --- 6. 割り勘画面 ---
    function renderSettlement() {
      const trip = getCurrentTrip();
      if (!trip) return '';

      const totalAmount = trip.expenses.reduce((sum, e) => sum + e.amount, 0);
      const memberCount = trip.members.length || 1;
      const perPerson = Math.ceil(totalAmount / memberCount);

      return `
        <div class="space-y-4">
          <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-xs font-bold text-gray-500">清算サマリー</h2>
            <div class="flex justify-between items-baseline mt-2">
              <span class="text-xs text-gray-600">合計支出:</span>
              <span class="text-lg font-extrabold text-gray-800">¥${totalAmount.toLocaleString()}</span>
            </div>
            <div class="flex justify-between items-baseline mt-1 border-t border-gray-100 pt-2">
              <span class="text-xs font-bold text-blue-600">1人あたり:</span>
              <span class="text-xl font-black text-blue-600">¥${perPerson.toLocaleString()}</span>
            </div>
          </div>

          <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h3 class="text-xs font-bold text-gray-700 mb-3">支出リスト</h3>
            <div class="space-y-2">
              ${trip.expenses.map(e => `
                <div class="flex justify-between items-center text-xs p-2 bg-gray-50 rounded">
                  <div>
                    <div class="font-bold text-gray-800">${e.title}</div>
                    <div class="text-gray-400">立替: ${e.payer}</div>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-gray-700">¥${e.amount.toLocaleString()}</span>
                    <button onclick="deleteExpense(${e.id})" class="text-gray-300 hover:text-red-500">✕</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="bg-white p-3 rounded-xl border border-dashed border-gray-300 space-y-2">
            <div class="text-xs font-bold text-gray-600">支出の追加</div>
            <input id="exp-title" type="text" placeholder="品目（例: タクシー代）" class="w-full border rounded-lg p-1.5 text-xs">
            <div class="grid grid-cols-2 gap-2">
              <input id="exp-amount" type="number" placeholder="金額 (円)" class="border rounded-lg p-1.5 text-xs">
              <select id="exp-payer" class="border rounded-lg p-1.5 text-xs">
                ${trip.members.map(m => `<option value="${m}">${m}</option>`).join('')}
              </select>
            </div>
            <button onclick="addExpense()" class="w-full bg-blue-600 text-white text-xs py-2 rounded-lg font-bold">追加する</button>
          </div>
        </div>
      `;
    }

    function addExpense() {
      const title = document.getElementById('exp-title').value.trim();
      const amount = parseInt(document.getElementById('exp-amount').value);
      const payer = document.getElementById('exp-payer').value;

      if (!title || isNaN(amount)) return alert("正確な情報を入力してください");

      const trip = getCurrentTrip();
      trip.expenses.push({ id: Date.now(), title, amount, payer });
      saveTrips();
      switchTab('settlement');
    }

    function deleteExpense(id) {
      const trip = getCurrentTrip();
      trip.expenses = trip.expenses.filter(e => e.id !== id);
      saveTrips();
      switchTab('settlement');
    }

    // --- 7. AI / チャット自動読み取り画面 ---
    function renderAI() {
      return `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3">
          <div class="flex items-center gap-2 text-indigo-600">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
            <h2 class="text-sm font-bold">チャット解析（日程追加）</h2>
          </div>
          <p class="text-xs text-gray-500 leading-relaxed">
            LINEなどの会話テキストを貼り付けると、時間と予定を自動抽出して日程表に追加します。
          </p>

          <textarea id="chat-input" class="w-full border border-gray-200 rounded-lg p-2.5 text-xs h-32 focus:outline-none focus:border-indigo-500" placeholder="【貼り付け例】
10:00に東京駅集合ね！
12時半から浅草でランチ食べて
15:00にホテルチェックインしよう"></textarea>

          <button onclick="parseChatText()" class="w-full bg-gradient-to-r from-indigo-500 to-blue-600 text-white text-xs py-2.5 rounded-lg font-bold shadow-md hover:opacity-90 transition">
            テキストを解析して日程に追加
          </button>
        </div>
      `;
    }

    function parseChatText() {
      const text = document.getElementById('chat-input').value;
      if (!text.trim()) return alert("テキストを入力してください");

      const lines = text.split('\n');
      const trip = getCurrentTrip();
      let addedCount = 0;

      lines.forEach(line => {
        const timeMatch = line.match(/(\d{1,2})[:：](\d{2})|(\d{1,2})時(半|(\d{2})分)?/);
        if (timeMatch) {
          let hours = 0;
          let minutes = "00";

          if (timeMatch[1] !== undefined) {
            hours = timeMatch[1].padStart(2, '0');
            minutes = timeMatch[2];
          } else if (timeMatch[3] !== undefined) {
            hours = timeMatch[3].padStart(2, '0');
            if (timeMatch[4] === '半') {
              minutes = "30";
            } else if (timeMatch[5]) {
              minutes = timeMatch[5].padStart(2, '0');
            }
          }

          const timeStr = `${hours}:${minutes}`;
          const titleStr = line.replace(timeMatch[0], '').replace(/[ねよ！!〜〜]/g, '').trim();

          if (titleStr) {
            trip.itinerary.push({
              day: 1,
              time: timeStr,
              title: titleStr,
              memo: "チャットから自動作成"
            });
            addedCount++;
          }
        }
      });

      if (addedCount > 0) {
        trip.itinerary.sort((a, b) => a.time.localeCompare(b.time));
        saveTrips();
        alert(`${addedCount} 件の予定を抽出して日程表に追加しました！`);
        switchTab('itinerary');
      } else {
        alert("時間と予定のパターンが見つかりませんでした。「10:00 集合」のように時間を含めて入力してください。");
      }
    }

    // --- 8. URL共有パース処理 ---
    function checkSharedURL() {
      const params = new URLSearchParams(window.location.search);
      const dataStr = params.get('data');
      if (dataStr) {
        try {
          const sharedTrip = JSON.parse(decodeURIComponent(dataStr));
          const exists = trips.find(t => t.id === sharedTrip.id);
          if (!exists) {
            trips.push(sharedTrip);
            currentTripId = sharedTrip.id;
            saveTrips();
            alert(`共有された旅行「${sharedTrip.title}」を追加しました！`);
          } else {
            currentTripId = sharedTrip.id;
          }
        } catch (e) {
          console.error("共有データの読み込みに失敗しました", e);
        }
      }
    }

    // --- 9. タブ切り替え ＆ 初期化 ---
    let currentTab = 'home';

    function switchTab(tabName) {
      currentTab = tabName;
      updateHeader();

      const tabs = ['home', 'itinerary', 'belongings', 'settlement', 'ai'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (btn) {
          if (t === tabName) {
            btn.className = "tab-btn flex flex-col items-center text-blue-600 font-bold";
          } else {
            btn.className = "tab-btn flex flex-col items-center text-gray-400";
          }
        }
      });

      const contentEl = document.getElementById('app-content');
      if (tabName === 'trips') {
        contentEl.innerHTML = renderTrips();
      } else if (tabName === 'home') {
        contentEl.innerHTML = renderHome();
      } else if (tabName === 'itinerary') {
        contentEl.innerHTML = renderItinerary();
      } else if (tabName === 'belongings') {
        contentEl.innerHTML = renderBelongings();
      } else if (tabName === 'settlement') {
        contentEl.innerHTML = renderSettlement();
      } else if (tabName === 'ai') {
        contentEl.innerHTML = renderAI();
      }

      // Lucide アイコンの再描画
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // 初期起動
    window.onload = function() {
      checkSharedURL();
      switchTab('home');
    };
  </script>
</body>
</html>
