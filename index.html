<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabiori - リアルタイム共有しおり</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDK (ES Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- Firebase 初期設定 ---
    // ※テスト用のFirebaseプロジェクト構成です。
    // ご自身のFirebaseプロジェクトを使用する場合は、以下のfirebaseConfigとdatabaseURLを書き換えてください。
    const firebaseConfig = {
      databaseURL: "https://tabiori-realtime-default-rtdb.firebaseio.com" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // グローバルスコープへ公開して既存スクリプトから呼び出し可能にする
    window.firebaseDB = db;
    window.dbRef = ref;
    window.dbOnValue = onValue;
    window.dbSet = set;
    
    // SDK読み込み完了イベントを発行
    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased pb-20 sm:pb-0">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-sm">
          <i data-lucide="map-pin" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 id="tripTitleDisplay" class="font-bold text-slate-900 leading-tight text-lg">Tabiori</h1>
          <span id="syncStatus" class="text-xs text-emerald-600 font-medium flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> リアルタイム同期中
          </span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="copyShareLink()" class="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-lg text-sm font-semibold transition">
          <i data-lucide="share-2" class="w-4 h-4"></i>
          <span>共有</span>
        </button>
        <button onclick="createNewTrip()" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span class="hidden sm:inline">新規作成</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- タブ切り替え -->
    <div class="flex border-b border-slate-200 bg-white rounded-xl p-1 shadow-sm">
      <button id="tabBtnItinerary" onclick="switchTab('itinerary')" class="flex-1 py-2 text-center font-bold text-sm rounded-lg transition bg-indigo-600 text-white">
        <i data-lucide="calendar" class="w-4 h-4 inline mr-1"></i> 旅程
      </button>
      <button id="tabBtnSplit" onclick="switchTab('split')" class="flex-1 py-2 text-center font-bold text-sm rounded-lg transition text-slate-500 hover:text-slate-900">
        <i data-lucide="calculator" class="w-4 h-4 inline mr-1"></i> ワリカン
      </button>
    </div>

    <!-- 旅程タブ -->
    <section id="tabContentItinerary" class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <span>スケジュール</span>
        </h2>
        <button onclick="openEventModal()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow-sm transition flex items-center gap-1">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> 予定を追加
        </button>
      </div>

      <!-- 予定一覧 -->
      <div id="eventList" class="space-y-3">
        <!-- JSで動的に追加されます -->
      </div>
    </section>

    <!-- ワリカンタブ -->
    <section id="tabContentSplit" class="space-y-4 hidden">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-800">立替・精算</h2>
        <button onclick="openExpenseModal()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow-sm transition flex items-center gap-1">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> 支出を記録
        </button>
      </div>

      <!-- 支出一覧 -->
      <div id="expenseList" class="space-y-3">
        <!-- JSで動的に追加されます -->
      </div>
    </section>

  </main>

  <!-- モーダル: 予定の追加・編集 -->
  <div id="eventModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg text-slate-900">予定の追加/編集</h3>
        <button onclick="closeModal('eventModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="eventForm" onsubmit="handleSaveEvent(event)" class="space-y-3">
        <input type="hidden" id="eventId">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">タイトル</label>
          <input type="text" id="eventTitle" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">時間</label>
            <input type="time" id="eventTime" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">種類</label>
            <select id="eventType" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm outline-none">
              <option value="spot">📍 観光スポット</option>
              <option value="move">🚗 移動</option>
              <option value="hotel">🏨 宿泊</option>
              <option value="food">🍽️ グルメ</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">メモ・予約情報</label>
          <textarea id="eventMemo" rows="2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm outline-none"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('eventModal')" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg font-medium">キャンセル</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- モーダル: 支出の追加 -->
  <div id="expenseModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg text-slate-900">支出の記録</h3>
        <button onclick="closeModal('expenseModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="expenseForm" onsubmit="handleSaveExpense(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">内容</label>
          <input type="text" id="expenseTitle" placeholder="例: 夕食代" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">金額 (円)</label>
            <input type="number" id="expenseAmount" placeholder="3000" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">支払った人</label>
            <input type="text" id="expensePayer" placeholder="例: たろう" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('expenseModal')" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg font-medium">キャンセル</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript アプリケーションロジック -->
  <script>
    // --- アプリケーション状態 ---
    let currentTripId = "";
    let isEditing = false; // モーダル開閉中フラグ（編集中はリモート同期で入力欄を破棄しないため）
    let currentTrip = {
      title: "みんなの旅行しおり",
      events: [],
      expenses: []
    };

    // --- 初期化ロジック ---
    window.addEventListener('firebase-ready', () => {
      // 1. URLハッシュからTripIDを取得、なければ新規発行
      currentTripId = window.location.hash.replace('#', '');
      if (!currentTripId) {
        currentTripId = 'trip_' + Math.random().toString(36).substr(2, 9);
        window.location.hash = currentTripId;
      }

      // 2. Firebase リアルタイム同期リスナー開始
      setupRealtimeSync(currentTripId);
      lucide.createIcons();
    });

    // --- Firebase リアルタイム同期 ---
    function setupRealtimeSync(tripId) {
      const tripRef = window.dbRef(window.firebaseDB, 'trips/' + tripId);
      
      window.dbOnValue(tripRef, (snapshot) =>
