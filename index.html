<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabiori 風 旅行しおりアプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDK (ES Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- Firebase 初期設定 ---
    // ※独自プロジェクトで運用する場合はご自身のFirebase consoleのDatabase URLに書き換えてください。
    const firebaseConfig = {
      databaseURL: "https://tabiori-realtime-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 既存の非モジュールスクリプトから利用可能にするためのグローバル展開
    window.firebaseDB = db;
    window.dbRef = ref;
    window.dbOnValue = onValue;
    window.dbSet = set;

    // SDK読み込み完了をイベントで通知
    window.dispatchEvent(new Event('firebase-ready'));
  </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-24">

  <!-- ヘッダー -->
  <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 id="header-title" class="text-lg font-bold">旅行しおり</h1>
        <p id="header-sub" class="text-xs text-blue-100">旅行を選択してください</p>
      </div>
      <div class="flex gap-1.5">
        <button onclick="shareActiveTrip()" class="bg-blue-700 hover:bg-blue-800 text-white text-xs px-2 py-1.5 rounded-lg flex items-center gap-1 font-bold" title="共有URLをコピー">
          <i data-lucide="share-2" class="w-4 h-4"></i>
          <span>共有</span>
        </button>
        <button onclick="showEditTripModal()" class="bg-blue-700 hover:bg-blue-800 text-white text-xs p-2 rounded-lg flex items-center justify-center font-bold" title="旅行設定の変更">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
        <button onclick="switchTab('trips')" class="bg-blue-700 hover:bg-blue-800 text-white text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 font-bold">
          <i data-lucide="folder" class="w-4 h-4"></i>
          <span>一覧</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ表示エリア -->
  <main id="app-content" class="p-4 max-w-md mx-auto"></main>

  <!-- モーダル表示領域 -->
  <div id="modal-container"></div>

  <!-- 下部タブバー -->
  <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 max-w-md mx-auto z-20">
    <button onclick="switchTab('home')" class="tab-btn flex flex-col items-center text-blue-600" id="tab-home">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-xs mt-1">ホーム</span>
    </button>
    <button onclick="switchTab('itinerary')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-itinerary">
      <i data-lucide="calendar" class="w-5 h-5"></i>
      <span class="text-xs mt-1">旅程</span>
    </button>
    <button onclick="switchTab('belongings')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-belongings">
      <i data-lucide="check-square" class="w-5 h-5"></i>
      <span class="text-xs mt-1">持ち物</span>
    </button>
    <button onclick="switchTab('settlement')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-settlement">
      <i data-lucide="japanese-yen" class="w-5 h-5"></i>
      <span class="text-xs mt-1">精算</span>
    </button>
    <button onclick="switchTab('ai')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-ai">
      <i data-lucide="sparkles" class="w-5 h-5"></i>
      <span class="text-xs mt-1">AI解析</span>
    </button>
  </nav>

  <script>
    const destinationPresets = [
      {
        keywords: ["温泉", "別府", "草津", "箱根", "湯布院", "大分"],
        items: ["フェイスタオル / 手ぬぐい", "ビニール袋", "スキンケア用品", "脱ぎ履きしやすい靴"]
      },
      {
        keywords: ["海", "ビーチ", "沖縄", "プール", "ハワイ", "グアム"],
        items: ["水着 / ラッシュガード", "サンダル", "日焼け止め", "防水スマホケース", "サングラス"]
      },
      {
        keywords: ["山", "ハイキング", "登山", "キャンプ"],
        items: ["レインウェア / 雨具", "虫よけスプレー", "モバイルバッテリー", "常備薬 / 絆創膏"]
      }
    ];

    const defaultTrips = [
      {
        id: "trip_default_1",
        title: "別府温泉旅行",
        destination: "大分・別府",
        startDate: "2026-09-19",
        endDate: "2026-09-21",
        nightsText: "2泊3日",
        daysCount: 3,
        members: ["たろう", "はなこ"],
        currencies: [],
        activeDay: 1,
        schedule: [
          { day: 1, date: "1日目", events: [] },
          { day: 2, date: "2日目", events: [] },
          { day: 3, date: "3日目", events: [] }
        ],
        belongings: [
          { id: 1, item: "着替え", checked: false },
          { id: 2, item: "充電器", checked: false }
        ],
        chatHistory: [
          { sender: 'ai', text: '旅程テキストを貼り付けて送信してください！自動で解析してカードを作成します。' }
        ]
      }
    ];

    let trips = JSON.parse(localStorage.getItem('my_trips')) || defaultTrips;
    let activeTripId = localStorage.getItem('active_trip_id') || trips[0]?.id;
    let openAccordions = {};
    let isRemoteUpdating = false;

    // 移行用：古いデータ形式（currencyCode/currencyRate）があればcurrencies配列に変換
    trips.forEach(t => {
      if (!t.currencies) {
        t.currencies = [];
        if (t.currencyCode && t.currencyRate) {
          t.currencies.push({ code: t.currencyCode, rate: t.currencyRate });
        }
        delete t.currencyCode;
        delete t.currencyRate;
      }
    });

    // Firebase リアルタイム同期の初期化
    window.addEventListener('firebase-ready', () => {
      checkSharedURL();
      setupRealtimeSync();
    });

    function setupRealtimeSync() {
      if (!window.firebaseDB || !activeTripId) return;
      const tripRef = window.dbRef(window.firebaseDB, 'trips/' + activeTripId);

      window.dbOnValue(tripRef, (snapshot) => {
        const remoteData = snapshot.val();
        if (remoteData) {
          isRemoteUpdating = true;
          const idx = trips.findIndex(t => t.id === remoteData.id);
          if (idx !== -1) {
            trips[idx] = remoteData;
          } else {
            trips.unshift(remoteData);
          }
          localStorage.setItem('my_trips', JSON.stringify(trips));
          
          updateHeader();
          const activeTabBtn = document.querySelector('.tab-btn.text-blue-600');
          const currentTab = activeTabBtn ? activeTabBtn.id.replace('tab-', '') : 'home';
          switchTab(currentTab);
          isRemoteUpdating = false;
        } else {
          saveTrips();
        }
      });
    }

    function checkSharedURL() {
      if (window.location.hash.startsWith('#trip=')) {
        try {
          const tripId = window.location.hash.replace('#trip=', '');
          if (tripId) {
            activeTripId = tripId;
            localStorage.setItem('active_trip_id', activeTripId);
            history.replaceState(null, '', window.location.pathname);
          }
        } catch (e) {
          console.error("共有URLの読み込みに失敗しました", e);
        }
      }
    }

    function shareActiveTrip() {
      const trip = getCurrentTrip();
      if (!trip) return;

      try {
        const shareURL = `${window.location.origin}${window.location.pathname}#trip=${trip.id}`;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareURL).then(() => {
            alert(`「${trip.title}」のリアルタイム共同編集用URLをクリップボードにコピーしました！\nこのURLを開いた人とリアルタイムで共同編集できます。`);
          });
        } else {
          prompt("以下のURLをコピーして友達に共有してください：", shareURL);
        }
      } catch (e) {
        alert("URLの作成に失敗しました。");
      }
    }

    function saveTrips() {
      localStorage.setItem('my_trips', JSON.stringify(trips));
      localStorage.setItem('active_trip_id', activeTripId);

      // リモート同期中のループ書き込みを防ぐ
      if (!isRemoteUpdating && window.firebaseDB && activeTripId) {
        const trip = getCurrentTrip();
        if (trip) {
          const tripRef = window.dbRef(window.firebaseDB, 'trips/' + activeTripId);
          window.dbSet(tripRef, trip);
        }
      }
    }

    function getCurrentTrip() {
      return trips.find(t => t.id === activeTripId) || trips[0];
    }

    function updateHeader() {
      const trip = getCurrentTrip();
      if (trip) {
        document.getElementById('header-title').innerText = trip.title;
        const dur = trip.nightsText || `${trip.daysCount}日間`;
        const mCount = trip.members ? trip.members.length : 1;
        document.getElementById('header-sub').innerText = `${trip.destination} / ${dur} (${mCount}名)`;
      } else {
        document.getElementById('header-title').innerText = "旅行しおり";
        document.getElementById('header-sub').innerText = "旅行を選択してください";
      }
    }

    function renderTrips() {
      const tripListHTML = trips.map(t => {
        const isActive = t.id === activeTripId;
        const dur = t.nightsText || `${t.daysCount}日間`;
        return `
          <div class="bg-white p-4 rounded-xl border ${isActive ? 'border-blue-500 ring-2 ring-blue-100' : 'border-gray-200'} shadow-sm mb-3 flex justify-between items-center">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="font-bold text-gray-800">${t.title}</h3>
                ${isActive ? '<span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full font-bold">選択中</span>' : ''}
              </div>
              <p class="text-xs text-gray-500 mt-1">📍 ${t.destination} ｜ 🗓 ${dur}</p>
            </div>
            <div class="flex gap-1.5">
              <button onclick="selectTrip('${t.id}')" class="text-xs ${isActive ? 'bg-gray-100 text-gray-400 cursor-default' : 'bg-blue-600 text-white hover:bg-blue-700'} font-bold px-3 py-1.5 rounded-lg">
                ${isActive ? '表示中' : '開く'}
              </button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          <button onclick="showCreateTripModal()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold p-3.5 rounded-xl shadow flex items-center justify-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span>新しい旅行を作成する</span>
          </button>
          <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">作成済みの旅行一覧</h2>
          <div>${tripListHTML}</div>
        </div>
      `;
    }

    function selectTrip(id) {
      activeTripId = id;
      saveTrips();
      setupRealtimeSync();
      switchTab('home');
    }

    function showCreateTripModal(isEdit = false) {
      const trip = isEdit ? getCurrentTrip() : null;
      const titleVal = trip ? trip.title : '';
      const destVal = trip ? trip.destination : '';
      const startVal = trip ? trip.startDate : '';
      const endVal = trip ? trip.endDate : '';
      const members = trip && trip.members ? trip.members : ['自分', 'メンバー2'];
      const currencies = trip && trip.currencies ? trip.currencies : [];

      const html = `
        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-white p-5 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md my-8 space-y-3">
            <h2 class="text-base font-bold text-gray-800 border-b pb-2">${isEdit ? '⚙️ 旅行設定の変更' : '✈️ 新しい旅行を作成'}</h2>
            
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">旅行タイトル</label>
              <input id="new-title" type="text" value="${titleVal}" placeholder="例：ヨーロッパ周遊旅行" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">目的地</label>
              <input id="new-dest" type="text" value="${destVal}" placeholder="例：フランス・パリ" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">開始日</label>
                <input id="new-start" type="date" value="${startVal}" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">終了日</label>
                <input id="new-end" type="date" value="${endVal}" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">参加メンバー（カンマ区切り）</label>
              <input id="new-members" type="text" value="${members.join(', ')}" placeholder="たろう, はなこ" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold text-gray-500 hover:bg-gray-100 rounded-lg">キャンセル</button>
              <button onclick="saveTripModal(${isEdit})" class="px-4 py-2 text-xs font-bold bg-blue-600 text-white hover:bg-blue-700 rounded-lg shadow">保存する</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modal-container').innerHTML = html;
    }

    function showEditTripModal() {
      showCreateTripModal(true);
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    function saveTripModal(isEdit) {
      const title = document.getElementById('new-title').value.trim() || '無題の旅行';
      const dest = document.getElementById('new-dest').value.trim() || '未定';
      const start = document.getElementById('new-start').value;
      const end = document.getElementById('new-end').value;
      const membersRaw = document.getElementById('new-members').value;
      const members = membersRaw ? membersRaw.split(',').map(m => m.trim()).filter(m => m) : ['自分'];

      let daysCount = 1;
      let nightsText = '日帰り';

      if (start && end) {
        const startDate = new Date(start);
        const endDate = new Date(end);
        const diffTime = endDate - startDate;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

        if (diffDays > 0) {
          daysCount = diffDays;
          nightsText = diffDays === 1 ? '日帰り' : `${diffDays - 1}泊${diffDays}日`;
        }
      }

      if (isEdit) {
        const trip = getCurrentTrip();
        if (trip) {
          trip.title = title;
          trip.destination = dest;
          trip.startDate = start;
          trip.endDate = end;
          trip.nightsText = nightsText;
          trip.daysCount = daysCount;
          trip.members = members;

          if (trip.schedule.length !== daysCount) {
            const newSchedule = [];
            for (let i = 1; i <= daysCount; i++) {
              const existingDay = trip.schedule.find(s => s.day === i);
              newSchedule.push(existingDay || { day: i, date: `${i}日目`, events: [] });
            }
            trip.schedule = newSchedule;
          }
        }
      } else {
        const newId = 'trip_' + Date.now();
        const schedule = [];
        for (let i = 1; i <= daysCount; i++) {
          schedule.push({ day: i, date: `${i}日目`, events: [] });
        }

        const autoBelongings = [
          { id: 1, item: "着替え", checked: false },
          { id: 2, item: "充電器", checked: false }
        ];

        destinationPresets.forEach(preset => {
          if (preset.keywords.some(kw => dest.includes(kw))) {
            preset.items.forEach(itemText => {
              if (!autoBelongings.some(b => b.item === itemText)) {
                autoBelongings.push({ id: Date.now() + Math.random(), item: itemText, checked: false });
              }
            });
          }
        });

        const newTrip = {
          id: newId,
          title: title,
          destination: dest,
          startDate: start,
          endDate: end,
          nightsText: nightsText,
          daysCount: daysCount,
          members: members,
          currencies: [],
          activeDay: 1,
          schedule: schedule,
          belongings: autoBelongings,
          chatHistory: [{ sender: 'ai', text: '旅程テキストを貼り付けて送信してください！自動で解析してカードを作成します。' }]
        };

        trips.unshift(newTrip);
        activeTripId = newId;
      }

      saveTrips();
      setupRealtimeSync();
      closeModal();
      switchTab('home');
    }

    function switchTab(tabName) {
      updateHeader();

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('text-blue-600');
        btn.classList.add('text-gray-400');
      });
      const activeTab = document.getElementById(`tab-${tabName}`);
      if (activeTab) {
        activeTab.classList.remove('text-gray-400');
        activeTab.classList.add('text-blue-600');
      }

      const content = document.getElementById('app-content');

      if (tabName === 'trips') {
        content.innerHTML = renderTrips();
      } else {
        const trip = getCurrentTrip();
        if (!trip) {
          content.innerHTML = renderTrips();
          lucide.createIcons();
          return;
        }

        if (tabName === 'home') {
          content.innerHTML = `
            <div class="space-y-4">
              <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
                <span class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-bold backdrop-blur-sm">📍 ${trip.destination}</span>
                <h2 class="text-xl font-black mt-2 mb-1">${trip.title}</h2>
                <p class="text-xs text-blue-100 flex items-center gap-1">🗓 ${trip.startDate || '日程未定'} 〜 ${trip.endDate || ''} (${trip.nightsText})</p>
              </div>

              <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-2">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">同行メンバー</h3>
                <div class="flex flex-wrap gap-1.5">
                  ${(trip.members || []).map(m => `<span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-lg font-bold border border-blue-100">${m}</span>`).join('')}
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <button onclick="switchTab('itinerary')" class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm hover:border-blue-400 text-left transition space-y-1">
                  <div class="p-2 bg-blue-50 text-blue-600 rounded-lg w-fit"><i data-lucide="calendar" class="w-5 h-5"></i></div>
                  <div class="font-bold text-sm text-gray-800">旅程表をかく</div>
                  <p class="text-[10px] text-gray-400">タイムスケジュール作成</p>
                </button>
                <button onclick="switchTab('belongings')" class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm hover:border-blue-400 text-left transition space-y-1">
                  <div class="p-2 bg-emerald-50 text-emerald-600 rounded-lg w-fit"><i data-lucide="check-square" class="w-5 h-5"></i></div>
                  <div class="font-bold text-sm text-gray-800">持ち物リスト</div>
                  <p class="text-[10px] text-gray-400">準備状況をチェック</p>
                </button>
              </div>
            </div>
          `;
        } else if (tabName === 'itinerary') {
          content.innerHTML = `
            <div class="space-y-4">
              <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                ${trip.schedule.map(s => `
                  <button onclick="setActiveDay(${s.day})" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${s.day === trip.activeDay ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-gray-600 border border-gray-200'}">
                    ${s.date}
                  </button>
                `).join('')}
              </div>
              <div class="space-y-3">
                <p class="text-xs font-bold text-gray-400">タップして詳細を展開 / 編集できます</p>
              </div>
            </div>
          `;
        } else if (tabName === 'belongings') {
          content.innerHTML = `
            <div class="space-y-4">
              <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3">
                <h3 class="font-bold text-sm text-gray-800">持ち物チェックリスト</h3>
                <div class="space-y-2">
                  ${(trip.belongings || []).map(b => `
                    <div class="flex items-center justify-between p-2 hover:bg-gray-50 rounded-lg">
                      <label class="flex items-center gap-2 cursor-pointer flex-1">
                        <input type="checkbox" ${b.checked ? 'checked' : ''} onchange="toggleBelonging(${b.id})" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                        <span class="text-xs font-bold ${b.checked ? 'line-through text-gray-400' : 'text-gray-700'}">${b.item}</span>
                      </label>
                      <button onclick="deleteBelonging(${b.id})" class="text-gray-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
        } else if (tabName === 'settlement') {
          content.innerHTML = `<div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center text-xs text-gray-500 font-bold">精算機能画面</div>`;
        } else if (tabName === 'ai') {
          content.innerHTML = `<div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center text-xs text-gray-500 font-bold">AI解析画面</div>`;
        }
      }

      lucide.createIcons();
    }

    function setActiveDay(day) {
      const trip = getCurrentTrip();
      if (trip) {
        trip.activeDay = day;
        saveTrips();
        switchTab('itinerary');
      }
    }

    function toggleBelonging(id) {
      const trip = getCurrentTrip();
      if (trip && trip.belongings) {
        const item = trip.belongings.find(b => b.id === id);
        if (item) {
          item.checked = !item.checked;
          saveTrips();
          switchTab('belongings');
        }
      }
    }

    function deleteBelonging(id) {
      const trip = getCurrentTrip();
      if (trip && trip.belongings) {
        trip.belongings = trip.belongings.filter(b => b.id !== id);
        saveTrips();
        switchTab('belongings');
      }
    }

    // 初期起動時の画面表示
    updateHeader();
    switchTab('home');
  </script>
</body>
</html>
