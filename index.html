<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabiori 風 旅行しおりアプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-24">

  <!-- ヘッダー -->
  <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 id="header-title" class="text-lg font-bold">旅行しおり</h1>
        <p id="header-sub" class="text-xs text-blue-100">旅行を選択してください</p>
      </div>
      <!-- 旅行切り替えボタン -->
      <button onclick="switchTab('trips')" class="bg-blue-700 hover:bg-blue-800 text-white text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 font-bold">
        <i data-lucide="folder" class="w-4 h-4"></i>
        <span>一覧</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ表示エリア -->
  <main id="app-content" class="p-4 max-w-md mx-auto">
    <!-- JSで切り替えます -->
  </main>

  <!-- 下部タブバー -->
  <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 max-w-md mx-auto z-20">
    <button onclick="switchTab('home')" class="tab-btn flex flex-col items-center text-blue-600" id="tab-home">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-xs mt-1">ホーム</span>
    </button>
    <button onclick="switchTab('itinerary')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-itinerary">
      <i data-lucide="calendar" class="w-5 h-5"></i>
      <span class="text-xs mt-1">旅程</span>
    </button>
    <button onclick="switchTab('belongings')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-belongings">
      <i data-lucide="check-square" class="w-5 h-5"></i>
      <span class="text-xs mt-1">持ち物</span>
    </button>
    <button onclick="switchTab('settlement')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-settlement">
      <i data-lucide="japanese-yen" class="w-5 h-5"></i>
      <span class="text-xs mt-1">精算</span>
    </button>
    <button onclick="switchTab('ai')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-ai">
      <i data-lucide="sparkles" class="w-5 h-5"></i>
      <span class="text-xs mt-1">AI相談</span>
    </button>
  </nav>

  <script>
    // 初期サンプルデータ
    const defaultTrips = [
      {
        id: "trip_default_1",
        title: "別府温泉＆高千穂 3日間の旅",
        destination: "大分・宮崎",
        startDate: "2026-09-10",
        daysCount: 3,
        membersCount: 3,
        activeDay: 1,
        schedule: [
          {
            day: 1,
            date: "1日目",
            events: [
              {
                id: "evt_101",
                time: "11:00",
                title: "別府地獄めぐり",
                transport: "🚗 大分空港からレンタカー45分",
                memo: "海地獄・血の池地獄を巡る定番ルート",
                bookingStatus: "unnecessary",
                mapUrl: "https://maps.google.com/?q=別府地獄めぐり",
                expense: { amount: 6000, paidBy: "メンバー1" }
              }
            ]
          },
          { day: 2, date: "2日目", events: [] },
          { day: 3, date: "3日目", events: [] }
        ],
        belongings: [
          { id: 1, item: "運転免許証", checked: true },
          { id: 2, item: "着替え", checked: false }
        ],
        chatHistory: [
          { sender: 'ai', text: 'こんにちは！旅行特化AIです。旅程のアドバイスやおすすめスポット、持ち物の追加提案などお任せください！' }
        ]
      }
    ];

    let trips = JSON.parse(localStorage.getItem('my_trips')) || defaultTrips;
    let activeTripId = localStorage.getItem('active_trip_id') || trips[0]?.id;

    function saveTrips() {
      localStorage.setItem('my_trips', JSON.stringify(trips));
      localStorage.setItem('active_trip_id', activeTripId);
    }

    function getCurrentTrip() {
      return trips.find(t => t.id === activeTripId) || trips[0];
    }

    function updateHeader() {
      const trip = getCurrentTrip();
      if (trip) {
        document.getElementById('header-title').innerText = trip.title;
        document.getElementById('header-sub').innerText = `${trip.destination} / ${trip.daysCount}日間 (${trip.membersCount}名)`;
      } else {
        document.getElementById('header-title').innerText = "旅行しおり";
        document.getElementById('header-sub').innerText = "旅行を作成してください";
      }
    }

    // --- 1. 旅行一覧 ＆ 新規作成画面 ---
    function renderTrips() {
      const tripListHTML = trips.map(t => {
        const isActive = t.id === activeTripId;
        return `
          <div class="bg-white p-4 rounded-xl border ${isActive ? 'border-blue-500 ring-2 ring-blue-100' : 'border-gray-200'} shadow-sm mb-3 flex justify-between items-center">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="font-bold text-gray-800">${t.title}</h3>
                ${isActive ? '<span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full font-bold">選択中</span>' : ''}
              </div>
              <p class="text-xs text-gray-500 mt-1">📍 ${t.destination} ｜ 🗓 ${t.startDate || '日付未定'} (${t.daysCount}日間) ｜ 👥 ${t.membersCount}名</p>
            </div>
            <button onclick="selectTrip('${t.id}')" class="text-xs ${isActive ? 'bg-gray-100 text-gray-400 cursor-default' : 'bg-blue-600 text-white hover:bg-blue-700'} font-bold px-3 py-1.5 rounded-lg">
              ${isActive ? '表示中' : '開く'}
            </button>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          <button onclick="showCreateTripModal()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold p-3.5 rounded-xl shadow flex items-center justify-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span>新しい旅行を作成する</span>
          </button>

          <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">作成済みの旅行一覧</h2>
          <div>${tripListHTML}</div>
        </div>
      `;
    }

    function showCreateTripModal() {
      const html = `
        <div class="bg-white p-5 rounded-2xl shadow-lg border border-gray-100 space-y-4">
          <h2 class="text-base font-bold text-gray-800 border-b pb-2">✈️ 新しい旅行の計画をスタート！</h2>
          
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">旅行タイトル</label>
            <input id="new-title" type="text" placeholder="例：北海道ドライブ旅、京都グルメツアー" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">行き先</label>
            <input id="new-destination" type="text" placeholder="例：札幌・小樽、京都市内" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">出発日</label>
              <input id="new-date" type="date" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">日数</label>
              <select id="new-days" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
                <option value="1">日帰り (1日)</option>
                <option value="2" selected>1泊2日 (2日)</option>
                <option value="3">2泊3日 (3日)</option>
                <option value="4">3泊4日 (4日)</option>
                <option value="5">4泊5日 (5日)</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">参加人数</label>
            <input id="new-members" type="number" value="2" min="1" max="20" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
          </div>

          <div class="flex gap-2 pt-2">
            <button onclick="switchTab('trips')" class="flex-1 bg-gray-100 text-gray-600 font-bold py-2 rounded-lg text-xs">キャンセル</button>
            <button onclick="createNewTrip()" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg text-xs hover:bg-blue-700">スタート！🚀</button>
          </div>
        </div>
      `;
      document.getElementById('app-content').innerHTML = html;
    }

    function createNewTrip() {
      const title = document.getElementById('new-title').value.trim() || '無題の旅行';
      const destination = document.getElementById('new-destination').value.trim() || '未定';
      const startDate = document.getElementById('new-date').value || '';
      const daysCount = parseInt(document.getElementById('new-days').value) || 2;
      const membersCount = parseInt(document.getElementById('new-members').value) || 2;

      const schedule = [];
      for (let i = 1; i <= daysCount; i++) {
        schedule.push({ day: i, date: `${i}日目`, events: [] });
      }

      const newTrip = {
        id: 'trip_' + Date.now(),
        title,
        destination,
        startDate,
        daysCount,
        membersCount,
        activeDay: 1,
        schedule,
        belongings: [
          { id: 1, item: "着替え", checked: false },
          { id: 2, item: "充電器", checked: false }
        ],
        chatHistory: [
          { sender: 'ai', text: `「${title}」の計画ですね！行き先やおすすめルートについて何でも気軽にご相談ください。` }
        ]
      };

      trips.unshift(newTrip);
      activeTripId = newTrip.id;
      saveTrips();
      switchTab('home');
    }

    function selectTrip(id) {
      activeTripId = id;
      saveTrips();
      switchTab('home');
    }

    // --- 2. ホーム画面 ---
    function renderHome() {
      const trip = getCurrentTrip();
      if (!trip) return renderTrips();

      return `
        <div class="space-y-4">
          <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-2xl p-5 shadow-lg">
            <span class="text-[10px] bg-white/20 backdrop-blur px-2 py-0.5 rounded-full font-semibold">📍 ${trip.destination}</span>
            <h2 class="text-xl font-bold mt-2">${trip.title}</h2>
            <p class="text-xs text-blue-100 mt-1">🗓 ${trip.startDate || '日付未定'} (${trip.daysCount}日間) / 👥 ${trip.membersCount}名</p>
            <div class="mt-4 flex gap-2">
              <button onclick="switchTab('itinerary')" class="bg-white text-blue-700 text-xs px-4 py-2 rounded-xl font-bold shadow-sm">旅程を編集・見る</button>
              <button onclick="switchTab('ai')" class="bg-blue-500/40 border border-white/30 text-white text-xs px-4 py-2 rounded-xl font-bold flex items-center gap-1">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> AI相談
              </button>
            </div>
          </div>
        </div>`;
    }

    // --- 3. 旅程画面 ---
    function renderItinerary() {
      const trip = getCurrentTrip();
      if (!trip) return '<div class="text-center text-gray-400 py-8">旅行を選択してください</div>';

      let dayTabsHTML = `<div class="flex space-x-2 mb-4 overflow-x-auto pb-1">`;
      trip.schedule.forEach(s => {
        const activeClass = s.day === trip.activeDay ? "bg-blue-600 text-white" : "bg-white text-gray-600 border";
        dayTabsHTML += `<button onclick="changeDay(${s.day})" class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap shadow-sm ${activeClass}">Day ${s.day}</button>`;
      });
      dayTabsHTML += `</div>`;

      const currentSchedule = trip.schedule.find(s => s.day === trip.activeDay);
      let eventsHTML = `<div class="space-y-3">`;

      if (!currentSchedule || currentSchedule.events.length === 0) {
        eventsHTML += `
          <div class="text-center py-8 bg-white rounded-xl border border-dashed border-gray-300">
            <p class="text-gray-400 text-xs">まだ予定が入っていません</p>
            <button onclick="addEventModal()" class="mt-2 text-xs text-blue-600 font-bold hover:underline">+ 予定を追加する</button>
          </div>`;
      } else {
        currentSchedule.events.forEach(evt => {
          eventsHTML += `
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
              <span class="text-xs font-bold text-blue-600">${evt.time}</span>
              <h3 class="font-bold text-gray-800 text-sm mt-0.5">${evt.title}</h3>
              ${evt.transport ? `<p class="text-xs text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded mt-1 inline-block">${evt.transport}</p>` : ''}
              ${evt.memo ? `<p class="text-xs text-gray-500 mt-1">${evt.memo}</p>` : ''}
            </div>`;
        });
        eventsHTML += `
          <button onclick="addEventModal()" class="w-full py-2 bg-blue-50 border border-blue-200 text-blue-600 text-xs font-bold rounded-xl flex items-center justify-center gap-1">
            <i data-lucide="plus" class="w-4 h-4"></i> 予定を追加
          </button>`;
      }
      eventsHTML += `</div>`;

      return dayTabsHTML + eventsHTML;
    }

    function changeDay(day) {
      const trip = getCurrentTrip();
      if (trip) {
        trip.activeDay = day;
        saveTrips();
        switchTab('itinerary');
      }
    }

    function addEventModal() {
      const time = prompt("時間（例: 10:00）");
      if (!time) return;
      const title = prompt("スポット名・予定（例: 大湯温泉）");
      if (!title) return;

      const trip = getCurrentTrip();
      const currentSchedule = trip.schedule.find(s => s.day === trip.activeDay);
      currentSchedule.events.push({
        id: 'evt_' + Date.now(),
        time,
        title,
        transport: '',
        memo: ''
      });
      saveTrips();
      switchTab('itinerary');
    }

    // --- 4. AI相談画面（目玉機能UIを残した状態） ---
    function renderAI() {
      const trip = getCurrentTrip();
      if (!trip) return '';

      if (!trip.chatHistory) {
        trip.chatHistory = [{ sender: 'ai', text: 'こんにちは！旅行特化AIです。旅程のご相談やアドバイスなど何でも聞いてください！' }];
      }

      let chatLogs = trip.chatHistory.map(msg => {
        if (msg.sender === 'user') {
          return `<div class="flex justify-end mb-3"><div class="bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none text-xs max-w-[80%]">${msg.text}</div></div>`;
        } else {
          return `
            <div class="flex justify-start mb-3 gap-2">
              <div class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xs font-bold shrink-0">AI</div>
              <div class="bg-white border p-3 rounded-2xl rounded-tl-none text-xs max-w-[85%] shadow-sm text-gray-800 whitespace-pre-wrap">${msg.text}</div>
            </div>`;
        }
      }).join('');

      return `
        <div class="flex flex-col h-[calc(100vh-140px)]">
          <div class="bg-blue-50 border border-blue-200 rounded-xl p-2.5 mb-3 flex items-center gap-2">
            <i data-lucide="sparkles" class="w-4 h-4 text-blue-600 shrink-0"></i>
            <p class="text-[11px] text-blue-800 leading-tight">現在AI機能はデモモードです。質問を入力すると旅程に応じた自動提案のUIを確認できます。</p>
          </div>

          <div class="flex-1 overflow-y-auto pr-1" id="chat-box">
            ${chatLogs}
          </div>
          <div class="mt-2 flex gap-2">
            <input id="ai-input" type="text" placeholder="おすすめのランチ教えて！など" class="flex-1 border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
            <button onclick="sendAIMessage()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold shrink-0">送信</button>
          </div>
        </div>
      `;
    }

    function sendAIMessage() {
      const input = document.getElementById('ai-input');
      const val = input.value.trim();
      if (!val) return;

      const trip = getCurrentTrip();
      if (!trip.chatHistory) trip.chatHistory = [];

      trip.chatHistory.push({ sender: 'user', text: val });
      
      // デモ用レスポンス（持ち物自動追加ロジック付き）
      setTimeout(() => {
        const dummyReply = `「${val}」ですね！\n「${trip.title}」（${trip.destination}）の旅程に合わせて、最適なおすすめスポットや移動ルートを提案します！\n\n💡 提案に合わせたおすすめの持ち物（例: 雨具・モバイルバッテリー）をリストに追加しました！`;
        trip.chatHistory.push({ sender: 'ai', text: dummyReply });

        // 目玉機能：持ち物リストへの自動連動の挙動も確認可能
        if (!trip.belongings.some(b => b.item === "モバイルバッテリー")) {
          trip.belongings.push({ id: Date.now(), item: "モバイルバッテリー", checked: false });
        }

        saveTrips();
        switchTab('ai');
      }, 500);

      saveTrips();
      switchTab('ai');
    }

    // --- 5. 持ち物画面 ---
    function renderBelongings() {
      const trip = getCurrentTrip();
      if (!trip) return '';

      return `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-sm font-bold text-gray-700">持ち物チェックリスト</h2>
            <span class="text-[10px] text-blue-600 bg-blue-50 px-2 py-0.5 rounded font-bold">AI提案連動</span>
          </div>
          <div class="space-y-2">
            ${trip.belongings.map(b => `
              <label class="flex items-center justify-between text-sm p-2 hover:bg-gray-50 rounded border-b border-gray-50 last:border-none">
                <div class="flex items-center gap-2">
                  <input type="checkbox" ${b.checked ? 'checked' : ''} onchange="toggleBelonging(${b.id})" class="w-4 h-4 text-blue-600 rounded">
                  <span class="${b.checked ? 'line-through text-gray-400' : 'text-gray-700'}">${b.item}</span>
                </div>
              </label>
            `).join('')}
          </div>
          <button onclick="addBelongingPrompt()" class="mt-3 w-full py-2 text-xs text-blue-600 font-bold bg-blue-50 rounded-lg hover:bg-blue-100">+ 持ち物を追加</button>
        </div>`;
    }

    function toggleBelonging(id) {
      const trip = getCurrentTrip();
      const item = trip.belongings.find(b => b.id === id);
      if (item) {
        item.checked = !item.checked;
        saveTrips();
        switchTab('belongings');
      }
    }

    function addBelongingPrompt() {
      const item = prompt("追加する持ち物名");
      if (!item) return;
      const trip = getCurrentTrip();
      trip.belongings.push({ id: Date.now(), item, checked: false });
      saveTrips();
      switchTab('belongings');
    }

    // --- 6. 精算画面 ---
    function renderSettlement() {
      return `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center py-8">
          <p class="text-sm font-bold text-gray-700">💰 立替・割り勘管理</p>
          <p class="text-xs text-gray-400 mt-1">旅程の各スポットから立替金額を登録できます</p>
        </div>`;
    }

    // --- タブ切り替え制御 ---
    const views = {
      home: renderHome,
      itinerary: renderItinerary,
      belongings: renderBelongings,
      settlement: renderSettlement,
      ai: renderAI,
      trips: renderTrips
    };

    function switchTab(tabName) {
      updateHeader();
      document.getElementById('app-content').innerHTML = views[tabName]();
      
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('text-blue-600');
        btn.classList.add('text-gray-400');
      });

      const activeTabBtn = document.getElementById(`tab-${tabName}`);
      if (activeTabBtn) {
        activeTabBtn.classList.remove('text-gray-400');
        activeTabBtn.classList.add('text-blue-600');
      }

      lucide.createIcons();
    }

    // 初期表示
    switchTab('home');
  </script>
</body>
</html>
