<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabiori 風 旅行しおりアプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-24">

  <!-- ヘッダー -->
  <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 id="header-title" class="text-lg font-bold">旅行しおり</h1>
        <p id="header-sub" class="text-xs text-blue-100">旅行を選択してください</p>
      </div>
      <div class="flex gap-1.5">
        <button onclick="shareActiveTrip()" class="bg-blue-700 hover:bg-blue-800 text-white text-xs px-2 py-1.5 rounded-lg flex items-center gap-1 font-bold" title="共有URLをコピー">
          <i data-lucide="share-2" class="w-4 h-4"></i>
          <span>共有</span>
        </button>
        <button onclick="showEditTripModal()" class="bg-blue-700 hover:bg-blue-800 text-white text-xs p-2 rounded-lg flex items-center justify-center font-bold" title="旅行設定の変更">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
        <button onclick="switchTab('trips')" class="bg-blue-700 hover:bg-blue-800 text-white text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 font-bold">
          <i data-lucide="folder" class="w-4 h-4"></i>
          <span>一覧</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ表示エリア -->
  <main id="app-content" class="p-4 max-w-md mx-auto"></main>

  <!-- モーダル表示領域 -->
  <div id="modal-container"></div>

  <!-- 下部タブバー -->
  <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 max-w-md mx-auto z-20">
    <button onclick="switchTab('home')" class="tab-btn flex flex-col items-center text-blue-600" id="tab-home">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-xs mt-1">ホーム</span>
    </button>
    <button onclick="switchTab('itinerary')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-itinerary">
      <i data-lucide="calendar" class="w-5 h-5"></i>
      <span class="text-xs mt-1">旅程</span>
    </button>
    <button onclick="switchTab('belongings')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-belongings">
      <i data-lucide="check-square" class="w-5 h-5"></i>
      <span class="text-xs mt-1">持ち物</span>
    </button>
    <button onclick="switchTab('settlement')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-settlement">
      <i data-lucide="japanese-yen" class="w-5 h-5"></i>
      <span class="text-xs mt-1">精算</span>
    </button>
    <button onclick="switchTab('ai')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-ai">
      <i data-lucide="sparkles" class="w-5 h-5"></i>
      <span class="text-xs mt-1">AI解析</span>
    </button>
  </nav>

  <script>
    const defaultTrips = [
      {
        id: "trip_default_1",
        title: "別府温泉旅行",
        destination: "大分・別府",
        startDate: "2026-09-19",
        endDate: "2026-09-21",
        nightsText: "2泊3日",
        daysCount: 3,
        members: ["自分", "メンバー2"],
        currencies: [{ code: "JPY", rate: 1.0 }],
        activeDay: 1,
        schedule: [
          { day: 1, date: "1日目", events: [] },
          { day: 2, date: "2日目", events: [] },
          { day: 3, date: "3日目", events: [] }
        ],
        belongings: [
          { id: 1, item: "着替え", checked: false },
          { id: 2, item: "充電器", checked: false }
        ],
        chatHistory: [
          { sender: 'ai', text: '旅程テキスト（1行でも複数行でもOK）を貼り付けて送信してください！自動で解析してカードを作成します。' }
        ]
      }
    ];

    let trips = JSON.parse(localStorage.getItem('my_trips')) || defaultTrips;
    let activeTripId = localStorage.getItem('active_trip_id') || trips[0]?.id;
    let openMemberDetails = {};

    function checkSharedURL() {
      if (window.location.hash.startsWith('#trip=')) {
        try {
          const encodedData = window.location.hash.replace('#trip=', '');
          const jsonStr = decodeURIComponent(atob(encodedData));
          const importedTrip = JSON.parse(jsonStr);

          if (importedTrip && importedTrip.id && importedTrip.title) {
            const existingIdx = trips.findIndex(t => t.id === importedTrip.id);
            if (existingIdx !== -1) {
              trips[existingIdx] = importedTrip;
            } else {
              trips.unshift(importedTrip);
            }
            activeTripId = importedTrip.id;
            saveTrips();
            alert(`「${importedTrip.title}」の旅行データを共有URLから読み込みました！`);
            history.replaceState(null, '', window.location.pathname);
          }
        } catch (e) {
          console.error("共有データのパースに失敗しました", e);
        }
      }
    }

    function shareActiveTrip() {
      const trip = getCurrentTrip();
      if (!trip) return;

      try {
        const jsonStr = JSON.stringify(trip);
        const encodedData = btoa(encodeURIComponent(jsonStr));
        const shareURL = `${window.location.origin}${window.location.pathname}#trip=${encodedData}`;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareURL).then(() => {
            alert(`「${trip.title}」の編集用共有URLをクリップボードにコピーしました！`);
          });
        } else {
          prompt("以下のURLをコピーして友達に共有してください：", shareURL);
        }
      } catch (e) {
        alert("データの容量が大きすぎるため共有URLを作成できませんでした。");
      }
    }

    function saveTrips() {
      localStorage.setItem('my_trips', JSON.stringify(trips));
      localStorage.setItem('active_trip_id', activeTripId);
    }

    function getCurrentTrip() {
      return trips.find(t => t.id === activeTripId) || trips[0];
    }

    function updateHeader() {
      const trip = getCurrentTrip();
      if (trip) {
        document.getElementById('header-title').innerText = trip.title;
        const dur = trip.nightsText || `${trip.daysCount}日間`;
        const mCount = trip.members ? trip.members.length : 1;
        document.getElementById('header-sub').innerText = `${trip.destination} / ${dur} (${mCount}名)`;
      } else {
        document.getElementById('header-title').innerText = "旅行しおり";
        document.getElementById('header-sub').innerText = "旅行を選択してください";
      }
    }

    function renderTrips() {
      const tripListHTML = trips.map(t => {
        const isActive = t.id === activeTripId;
        const dur = t.nightsText || `${t.daysCount}日間`;
        return `
          <div class="bg-white p-4 rounded-xl border ${isActive ? 'border-blue-500 ring-2 ring-blue-100' : 'border-gray-200'} shadow-sm mb-3 flex justify-between items-center">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="font-bold text-gray-800">${t.title}</h3>
                ${isActive ? '<span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full font-bold">選択中</span>' : ''}
              </div>
              <p class="text-xs text-gray-500 mt-1">📍 ${t.destination} ｜ 🗓 ${dur}</p>
            </div>
            <div class="flex gap-1.5">
              <button onclick="selectTrip('${t.id}')" class="text-xs ${isActive ? 'bg-gray-100 text-gray-400 cursor-default' : 'bg-blue-600 text-white hover:bg-blue-700'} font-bold px-3 py-1.5 rounded-lg">
                ${isActive ? '表示中' : '開く'}
              </button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          <button onclick="showCreateTripModal()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold p-3.5 rounded-xl shadow flex items-center justify-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span>新しい旅行を作成する</span>
          </button>
          <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">作成済みの旅行一覧</h2>
          <div>${tripListHTML}</div>
        </div>
      `;
    }

    function showCreateTripModal(isEdit = false) {
      const trip = isEdit ? getCurrentTrip() : null;
      const titleVal = trip ? trip.title : '';
      const destVal = trip ? trip.destination : '';
      const startVal = trip ? trip.startDate : '';
      const endVal = trip ? trip.endDate : '';
      const members = trip && trip.members ? trip.members : ['自分', 'メンバー2'];

      const html = `
        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-white p-5 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md my-8 space-y-3">
            <h2 class="text-base font-bold text-gray-800 border-b pb-2">${isEdit ? '⚙️ 旅行設定の変更' : '✈️ 新しい旅行を作成'}</h2>
            
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">旅行タイトル</label>
              <input id="new-title" type="text" value="${titleVal}" placeholder="例：別府温泉旅行" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">行き先</label>
              <input id="new-destination" type="text" value="${destVal}" placeholder="例：大分・別府" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">出発日</label>
                <input id="new-start-date" type="date" value="${startVal}" onchange="calculateNights()" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">到着日</label>
                <input id="new-end-date" type="date" value="${endVal}" onchange="calculateNights()" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
              </div>
            </div>

            <div id="nights-display" class="text-xs font-bold text-blue-600 bg-blue-50 p-2 rounded-lg text-center hidden">
              期間: <span id="nights-text"></span>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">人数</label>
              <select id="new-member-count" onchange="updateMemberInputs()" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
                ${[1,2,3,4,5,6].map(n => `<option value="${n}" ${members.length === n ? 'selected' : ''}>${n}名</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">メンバーの名前</label>
              <div id="member-inputs-container" class="space-y-1.5"></div>
            </div>

            <div class="flex gap-2 pt-2 border-t">
              <button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-600 font-bold py-2 rounded-lg text-xs">キャンセル</button>
              <button onclick="saveTripSettings(${isEdit})" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg text-xs hover:bg-blue-700">${isEdit ? '設定を保存' : '作成する'}</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modal-container').innerHTML = html;
      updateMemberInputs(members);
      calculateNights();
    }

    function showEditTripModal() { showCreateTripModal(true); }

    function calculateNights() {
      const startVal = document.getElementById('new-start-date').value;
      const endVal = document.getElementById('new-end-date').value;
      const display = document.getElementById('nights-display');
      const textSpan = document.getElementById('nights-text');

      if (startVal && endVal) {
        const start = new Date(startVal);
        const end = new Date(endVal);
        const diffTime = end - start;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

        if (diffDays > 0) {
          const nights = diffDays - 1;
          const text = nights === 0 ? "日帰り" : `${nights}泊${diffDays}日`;
          textSpan.innerText = text;
          display.classList.remove('hidden');
          return { nights, days: diffDays, text };
        }
      }
      display.classList.add('hidden');
      return { nights: 0, days: 1, text: '1日' };
    }

    function updateMemberInputs(existingMembers = null) {
      const count = parseInt(document.getElementById('new-member-count').value);
      const container = document.getElementById('member-inputs-container');
      let html = '';
      for (let i = 1; i <= count; i++) {
        let name = existingMembers && existingMembers[i - 1] ? existingMembers[i - 1] : (i === 1 ? '自分' : `メンバー${i}`);
        html += `<input type="text" class="member-name-input w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500" placeholder="名前 ${i}" value="${name}">`;
      }
      container.innerHTML = html;
    }

    function saveTripSettings(isEdit) {
      const title = document.getElementById('new-title').value.trim() || '無題の旅行';
      const destination = document.getElementById('new-destination').value.trim() || '未定';
      const startDate = document.getElementById('new-start-date').value || '';
      const endDate = document.getElementById('new-end-date').value || '';

      const { days, text } = calculateNights();
      const daysCount = days > 0 ? days : 1;

      const memberInputs = document.querySelectorAll('.member-name-input');
      const members = Array.from(memberInputs).map((input, idx) => input.value.trim() || `メンバー${idx + 1}`);

      if (isEdit) {
        const trip = getCurrentTrip();
        trip.title = title;
        trip.destination = destination;
        trip.startDate = startDate;
        trip.endDate = endDate;
        trip.nightsText = text;
        trip.daysCount = daysCount;
        trip.members = members;

        while (trip.schedule.length < daysCount) {
          const nextDay = trip.schedule.length + 1;
          trip.schedule.push({ day: nextDay, date: `${nextDay}日目`, events: [] });
        }
      } else {
        const schedule = [];
        for (let i = 1; i <= daysCount; i++) {
          schedule.push({ day: i, date: `${i}日目`, events: [] });
        }

        const newTrip = {
          id: 'trip_' + Date.now(),
          title,
          destination,
          startDate,
          endDate,
          nightsText: text,
          daysCount,
          currencies: [{ code: 'JPY', rate: 1.0 }],
          members,
          activeDay: 1,
          schedule,
          belongings: [
            { id: 1, item: "着替え", checked: false },
            { id: 2, item: "充電器", checked: false }
          ],
          chatHistory: [{ sender: 'ai', text: `「${title}」の計画ですね！テキストを貼り付ければ一括で自動抽出します！` }]
        };
        trips.unshift(newTrip);
        activeTripId = newTrip.id;
      }

      saveTrips();
      closeModal();
      switchTab('home');
    }

    function selectTrip(id) {
      activeTripId = id;
      saveTrips();
      switchTab('home');
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    function renderHome() {
      const trip = getCurrentTrip();
      if (!trip) return renderTrips();

      const memberCount = trip.members ? trip.members.length : 1;
      const dur = trip.nightsText || `${trip.daysCount}日間`;

      return `
        <div class="space-y-4">
          <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-2xl p-5 shadow-lg">
            <span class="text-[10px] bg-white/20 backdrop-blur px-2 py-0.5 rounded-full font-semibold">📍 ${trip.destination}</span>
            <h2 class="text-xl font-bold mt-2">${trip.title}</h2>
            <p class="text-xs text-blue-100 mt-1">🗓 ${dur} / 👥 ${memberCount}名 (${trip.members ? trip.members.join(', ') : ''})</p>
            <div class="mt-4 flex gap-2">
              <button onclick="switchTab('itinerary')" class="bg-white text-blue-700 text-xs px-4 py-2 rounded-xl font-bold shadow-sm">旅程を見よう</button>
              <button onclick="shareActiveTrip()" class="bg-blue-500/40 border border-white/30 text-white text-xs px-3 py-2 rounded-xl font-bold flex items-center gap-1">
                <i data-lucide="share-2" class="w-3.5 h-3.5"></i> 共有URL作成
              </button>
            </div>
          </div>
        </div>`;
    }

    function getBookingBadge(status) {
      if (status === 'reserved') {
        return `<span class="text-[10px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded border border-green-300">✅ 予約済み</span>`;
      } else if (status === 'unreserved') {
        return `<span class="text-[10px] bg-red-100 text-red-600 font-bold px-2 py-0.5 rounded border border-red-300">⚠️ 要予約</span>`;
      } else {
        return `<span class="text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded">予約不要</span>`;
      }
    }

    function renderItinerary() {
      const trip = getCurrentTrip();
      if (!trip) return '<div class="text-center text-gray-400 py-8">旅行を選択してください</div>';

      let dayTabsHTML = `<div class="flex space-x-2 mb-4 overflow-x-auto pb-1">`;
      trip.schedule.forEach(s => {
        const activeClass = s.day === trip.activeDay ? "bg-blue-600 text-white" : "bg-white text-gray-600 border";
        dayTabsHTML += `<button onclick="changeDay(${s.day})" class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap shadow-sm ${activeClass}">Day ${s.day}</button>`;
      });
      dayTabsHTML += `</div>`;

      const currentDay = trip.activeDay;
      const dayEvents = [];

      trip.schedule.forEach(s => {
        s.events.forEach(evt => {
          const type = evt.type || 'spot';
          if (type === 'hotel') {
            const startDay = Number(evt.startDay || 1);
            const endDay = Number(evt.endDay || startDay + 1);
            if (currentDay >= startDay && currentDay < endDay) {
              dayEvents.push(evt);
            }
          } else {
            if (s.day === currentDay) {
              dayEvents.push(evt);
            }
          }
        });
      });

      dayEvents.sort((a, b) => {
        const typeA = a.type || 'spot';
        const typeB = b.type || 'spot';
        if (typeA === 'hotel' && typeB !== 'hotel') return 1;
        if (typeA !== 'hotel' && typeB === 'hotel') return -1;
        return (a.time || '').localeCompare(b.time || '');
      });

      let eventsHTML = `<div class="space-y-3">`;

      if (dayEvents.length === 0) {
        eventsHTML += `
          <div class="text-center py-8 bg-white rounded-xl border border-dashed border-gray-300">
            <p class="text-gray-400 text-xs">まだ予定が入っていません</p>
            <button onclick="openEventModal()" class="mt-2 text-xs text-blue-600 font-bold hover:underline">+ 予定を追加する</button>
          </div>`;
      } else {
        dayEvents.forEach(evt => {
          const type = evt.type || 'spot';

          let expenseBadge = '';
          if (evt.expense) {
            expenseBadge = `<span class="text-xs font-bold text-green-700 bg-green-50 px-2 py-0.5 rounded border border-green-200">💰 ¥${Number(evt.expense).toLocaleString()}</span>`;
          }

          if (type === 'hotel') {
            eventsHTML += `
              <div onclick="openEventModal('${evt.id}')" class="bg-indigo-50/70 border-2 border-indigo-200 p-4 rounded-xl shadow-sm cursor-pointer hover:border-indigo-400 transition space-y-1.5 mt-4">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-bold text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded-md">🏨 宿泊（Day ${evt.startDay}〜Day ${evt.endDay}）</span>
                  ${getBookingBadge(evt.bookingStatus)}
                </div>
                <h3 class="font-bold text-indigo-950 text-base">${evt.title}</h3>
                ${evt.memo ? `<p class="text-xs text-indigo-900/80 bg-white/80 p-2 rounded">${evt.memo}</p>` : ''}
                ${expenseBadge ? `<div class="pt-0.5">${expenseBadge}</div>` : ''}
              </div>`;
          } else if (type === 'move') {
            const timeDisplay = evt.endTime ? `${evt.time || ''} 〜 ${evt.endTime}` : (evt.time || '時間未指定');
            eventsHTML += `
              <div onclick="openEventModal('${evt.id}')" class="bg-amber-50/60 border border-amber-200 p-4 rounded-xl shadow-sm cursor-pointer hover:border-amber-400 transition space-y-1.5">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-bold text-amber-700">🚌 移動 ｜ 🕒 ${timeDisplay}</span>
                  ${getBookingBadge(evt.bookingStatus)}
                </div>
                <div class="flex items-center gap-2 text-base font-bold text-gray-800">
                  <span>${evt.fromLoc || '出発地'}</span>
                  <span class="text-amber-500">➔</span>
                  <span>${evt.toLoc || '到着地'}</span>
                </div>
                ${evt.title && evt.title !== '移動' ? `<p class="text-xs text-gray-600">手段/備考: ${evt.title}</p>` : ''}
                ${evt.memo ? `<p class="text-xs text-gray-500 bg-white p-2 rounded border border-amber-100">${evt.memo}</p>` : ''}
                ${expenseBadge ? `<div class="pt-0.5">${expenseBadge}</div>` : ''}
              </div>`;
          } else {
            const timeDisplay = evt.endTime ? `${evt.time || '未設定'} 〜 ${evt.endTime}` : (evt.time || '時間未設定');
            eventsHTML += `
              <div onclick="openEventModal('${evt.id}')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer hover:border-blue-300 transition space-y-1.5">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-bold text-blue-600">🕒 ${timeDisplay}</span>
                  ${getBookingBadge(evt.bookingStatus)}
                </div>
                <h3 class="font-bold text-gray-800 text-base">${evt.title}</h3>
                ${evt.memo ? `<p class="text-xs text-gray-500 bg-gray-50 p-2 rounded">${evt.memo}</p>` : ''}
                ${expenseBadge ? `<div class="pt-0.5">${expenseBadge}</div>` : ''}
              </div>`;
          }
        });

        eventsHTML += `
          <button onclick="openEventModal()" class="w-full py-3 bg-blue-50 border border-blue-200 text-blue-600 text-xs font-bold rounded-xl flex items-center justify-center gap-1 shadow-sm mt-2">
            <i data-lucide="plus" class="w-4 h-4"></i> 新しい予定を入力・追加
          </button>`;

      currentSelectedType = type;

      const moveBtn = document.getElementById('type-btn-move');

      const spotField = document.getElementById('field-spot');
      const hotelField = document.getElementById('field-hotel');
      const moveField = document.getElementById('field-move');

      [spotBtn, hotelBtn, moveBtn].forEach(btn => btn.className = "py-1.5 text-xs font-bold rounded-lg transition text-gray-500");
      [spotField, hotelField, moveField].forEach(f => f.classList.add('hidden'));

      if (type === 'hotel') {
        hotelBtn.className = "py-1.5 text-xs font-bold rounded-lg transition bg-white text-indigo-700 shadow-sm";
        hotelField.classList.remove('hidden');

        moveBtn.className = "py-1.5 text-xs font-bold rounded-lg transition bg-white text-amber-700 shadow-sm";
        moveField.classList.remove('hidden');
      } else {
        spotBtn.className = "py-1.5 text-xs font-bold rounded-lg transition bg-white text-blue-600 shadow-sm";
        spotField.classList.remove('hidden');
      }
    }

    function saveEvent(eventId) {
      const type = currentSelectedType;
      let title = '';
      let time = '', endTime = '';
      let startDay = 1, endDay = 2;
      let fromLoc = '', toLoc = '';

      if (type === 'hotel') {
        title = document.getElementById('evt-title-hotel').value.trim();
        startDay = Number(document.getElementById('evt-start-day').value);
        endDay = Number(document.getElementById('evt-end-day').value);
        if (!title) { alert('ホテル・宿泊施設名を入力してください！'); return; }
      } else if (type === 'move') {
        fromLoc = document.getElementById('evt-from-loc').value.trim();
        toLoc = document.getElementById('evt-to-loc').value.trim();
        title = document.getElementById('evt-title-move').value.trim();
        time = document.getElementById('evt-move-time').value;
        endTime = document.getElementById('evt-move-end-time').value;
        if (!fromLoc || !toLoc) { alert('出発地と到着地の両方を入力してください！'); return; }
      } else {
        title = document.getElementById('evt-title-spot').value.trim();
        time = document.getElementById('evt-time').value;
        endTime = document.getElementById('evt-end-time').value;
        if (!title) { alert('スポット名を入力してください！'); return; }
      }

      const trip = getCurrentTrip();
      const currentSchedule = trip.schedule.find(s => s.day === trip.activeDay);
      
      trip.schedule.forEach(s => {
        s.events = s.events.filter(e => e.id !== eventId);
      });

      const eventData = {
        id: eventId,
        type,
        title,
        time,
        endTime,
        startDay,
        endDay,
        fromLoc,
        toLoc,
        bookingStatus: document.getElementById('evt-booking').value,
        expense: document.getElementById('evt-expense').value,
        currency: 'JPY',
        paidBy: document.getElementById('evt-paidBy').value,
        forMembers: trip.members ? [...trip.members] : ['自分'],
        memo: document.getElementById('evt-memo').value.trim()
      };

      currentSchedule.events.push(eventData);

      saveTrips();
      closeModal();
      switchTab('itinerary');
    }

      saveTrips();
      closeModal();

              <div class="mt-2.5 p-3 bg-blue-50 border border-blue-200 rounded-xl space-y-1 text-xs">
                <div class="flex justify-between items-center font-bold text-blue-900 border-b border-blue-200 pb-1">

                </div>
                <div><b>内容:</b> ${pe.title || (pe.fromLoc + ' ➔ ' + pe.toLoc)}</div>
                ${pe.time ? `<div><b>時間:</b> ${pe.time} ${pe.endTime ? '〜 ' + pe.endTime : ''}</div>` : ''}
                <button onclick="applyParsedEvent(${index}, ${peIdx})" class="mt-2 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded-lg text-xs flex items-center justify-center gap-1 shadow-sm">
                  <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 旅程にこの予定を追加
                </button>
              </div>
            `).join('');

            if (msg.parsedEvents.length > 1) {
              parsedCards += `
                <button onclick="applyAllParsedEvents(${index})" class="mt-3 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1 shadow">
                  <i data-lucide="check-circle" class="w-4 h-4"></i> 上記 ${msg.parsedEvents.length} 件の予定を一括追加する
                </button>
              `;
            }
          }

          return `
            <div class="flex justify-start mb-3 gap-2">
              <div class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xs font-bold shrink-0">AI</div>
              <div class="bg-white border p-3 rounded-2xl rounded-tl-none text-xs max-w-[85%] shadow-sm text-gray-800 whitespace-pre-wrap">${msg.text}${parsedCards}</div>
            </div>`;
        }
      }).join('');

      return `
        <div class="flex flex-col h-[calc(100vh-140px)]">
          <div class="bg-blue-50 border border-blue-200 rounded-xl p-2.5 mb-3 flex items-center gap-2">
            <i data-lucide="sparkles" class="w-4 h-4 text-blue-600 shrink-0"></i>
            <p class="text-[11px] text-blue-800 leading-tight">複数行のスケジュール文章もまとめて自動解析できます！</p>
          </div>

            ${chatLogs}
          </div>
          <div class="mt-2 flex flex-col gap-2">

            <button onclick="sendAIMessage()" class="w-full bg-blue-600 text-white py-2 rounded-xl text-xs font-bold shadow">解析して予定を抽出する</button>

    function sendAIMessage() {
      const input = document.getElementById('ai-input');
      const val = input.value.trim();
      if (!val) return;

      const trip = getCurrentTrip();
      if (!trip.chatHistory) trip.chatHistory = [];

      trip.chatHistory.push({ sender: 'user', text: val });
      
      setTimeout(() => {
        const events = parseTextToEvents(val, trip);
        let replyText = "";
        
        if (events.length > 0) {
          replyText = `テキストから ${events.length} 件の予定情報を正確に検出しました！\n確認して「旅程に追加」ボタンを押してください。`;
        } else {
          replyText = "テキストをパースできませんでした。時間やスポット名が含まれているかご確認ください。";
        }

        trip.chatHistory.push({ 
          sender: 'ai', 
          text: replyText,
          parsedEvents: events.length > 0 ? events : null
        });
        saveTrips();
        switchTab('ai');
      }, 300);

      saveTrips();
      switchTab('ai');
    }

    // 複数行・多様なフォーマットに対応した高度なテキスト解析ロジック
    function parseTextToEvents(fullText, trip) {
      const lines = fullText.split('\n');
      const results = [];
      let currentDay = trip.activeDay || 1;

      lines.forEach(line => {
        const text = line.trim();
        if (!text) return;

        // Day検出 (例: 1日目, Day2, 🗓️1日目 など)
        const dayMatch = text.match(/(?:🗓️)?\s*(\d+)\s*日目/i) || text.match(/Day\s*(\d+)/i);
        if (dayMatch) {
          currentDay = Math.min(parseInt(dayMatch[1]), trip.daysCount);
        }

        // 時間パターンの検出 (例: 13:15〜14:15, 10:00, 10時00分, 10:00発)
        let time = '', endTime = '';
        const rangeMatch = text.match(/(\d{1,2}:\d{2})\s*(?:〜|~|-|ー)\s*(\d{1,2}:\d{2})/);
        if (rangeMatch) {
          time = rangeMatch[1];
          endTime = rangeMatch[2];
        } else {
          const singleMatch = text.match(/(\d{1,2}:\d{2})/);
          if (singleMatch) time = singleMatch[1];
        }

        // 矢印「→」による移動検出 (例: 羽田 → 別府泊)
        let type = 'spot';
        let fromLoc = '', toLoc = '';
        const arrowSplit = text.split(/→|➔|->/);

        if (arrowSplit.length >= 2) {
          type = 'move';
          fromLoc = arrowSplit[0].replace(/.*?(?:\d+日目|[\d:]+|\s)+/, '').trim();
          toLoc = arrowSplit[1].replace(/泊|着|発|🚗|✈️/g, '').trim();
        } else if (/ホテル|宿|チェックイン|宿泊|旅館/i.test(text)) {
          type = 'hotel';
        } else if (/発|着|レンタカー|ドライブ/i.test(text)) {
          type = 'move';
        }

        // スポット・タイトル名抽出（時間記号や絵文字の除去）
        let title = text
          .replace(/(?:🗓️)?\s*\d+\s*日目.*$/g, '')
          .replace(/\d{1,2}:\d{2}(?:\s*(?:〜|~|-|ー)\s*\d{1,2}:\d{2})?/, '')
          .replace(/✈️|🚗|♨️|📍|🏨|🚌/g, '')
          .replace(/発|着|手続き/g, '')
          .trim();

        if (type === 'move' && !fromLoc) {
          fromLoc = title || "出発地";
          toLoc = "目的地";
        }

        if (time || title || fromLoc) {
          results.push({
            id: 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            type,
            day: currentDay,
            title: title || (type === 'hotel' ? '宿泊地' : 'スポット'),
            time,
            endTime,
            startDay: currentDay,
            endDay: Math.min(currentDay + 1, trip.daysCount),
            fromLoc,
            toLoc,
            bookingStatus: 'unnecessary',
            expense: '',
            currency: 'JPY',
            paidBy: trip.members ? trip.members[0] : '自分',
            forMembers: trip.members ? [...trip.members] : ['自分'],
            memo: ''
          });
        }
      });

      return results;
    }

    function applyParsedEvent(historyIndex, eventIndex) {
      const trip = getCurrentTrip();
      const msg = trip.chatHistory[historyIndex];
      if (!msg || !msg.parsedEvents) return;

      const pe = msg.parsedEvents[eventIndex];
      const targetSchedule = trip.schedule.find(s => s.day === pe.day) || trip.schedule[0];

      targetSchedule.events.push({ ...pe });
      trip.activeDay = pe.day;

      msg.parsedEvents.splice(eventIndex, 1);
      saveTrips();

      alert(`「${pe.title || pe.fromLoc}」を追加しました！`);
      switchTab('itinerary');
    }

    function applyAllParsedEvents(historyIndex) {
      const trip = getCurrentTrip();
      const msg = trip.chatHistory[historyIndex];
      if (!msg || !msg.parsedEvents) return;

      msg.parsedEvents.forEach(pe => {
        const targetSchedule = trip.schedule.find(s => s.day === pe.day) || trip.schedule[0];
        targetSchedule.events.push({ ...pe });
      });

      const count = msg.parsedEvents.length;
      msg.parsedEvents = [];
      saveTrips();

      alert(`${count} 件の予定を一括追加しました！`);
      switchTab('itinerary');
    }

      return `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
          <h2 class="text-sm font-bold text-gray-700 mb-3">持ち物チェックリスト</h2>
          <div class="space-y-2">
            ${trip.belongings.map(b => `
              <label class="flex items-center justify-between text-sm p-2 hover:bg-gray-50 rounded border-b border-gray-50 last:border-none">
                <div class="flex items-center gap-2">
                  <input type="checkbox" ${b.checked ? 'checked' : ''} onchange="toggleBelonging(${b.id})" class="w-4 h-4 text-blue-600 rounded">
                  <span class="${b.checked ? 'line-through text-gray-400' : 'text-gray-700'}">${b.item}</span>
                </div>
              </label>
            `).join('')}
          </div>
          <button onclick="addBelongingPrompt()" class="mt-3 w-full py-2 text-xs text-blue-600 font-bold bg-blue-50 rounded-lg hover:bg-blue-100">+ 持ち物を追加</button>
        </div>`;
    }

    function toggleBelonging(id) {
      const trip = getCurrentTrip();
      const item = trip.belongings.find(b => b.id === id);
      if (item) {
        item.checked = !item.checked;
        saveTrips();
        switchTab('belongings');
      }
    }

    function addBelongingPrompt() {
      const item = prompt("追加する持ち物名");
      if (!item) return;
      const trip = getCurrentTrip();
      trip.belongings.push({ id: Date.now(), item, checked: false });
      saveTrips();
      switchTab('belongings');
    }

    const views = {
      home: renderHome,
      itinerary: renderItinerary,
      belongings: renderBelongings,
      settlement: renderSettlement,
      ai: renderAI,
      trips: renderTrips
    };

    function switchTab(tabName) {
      updateHeader();
      document.getElementById('app-content').innerHTML = views[tabName]();
      
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('text-blue-600');
        btn.classList.add('text-gray-400');
      });

      const activeTabBtn = document.getElementById(`tab-${tabName}`);
      if (activeTabBtn) {
        activeTabBtn.classList.remove('text-gray-400');
        activeTabBtn.classList.add('text-blue-600');
      }

      lucide.createIcons();
    }

    checkSharedURL();
    switchTab('home');
  </script>
</body>
</html>
