<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabiori 風 旅行しおりアプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-24">

  <!-- ヘッダー -->
  <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 id="header-title" class="text-lg font-bold">旅行しおり</h1>
        <p id="header-sub" class="text-xs text-blue-100">旅行を選択してください</p>
      </div>
      <div class="flex gap-1.5">
        <button onclick="showEditTripModal()" class="bg-blue-700 hover:bg-blue-800 text-white text-xs p-2 rounded-lg flex items-center justify-center font-bold" title="旅行設定の変更">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
        <button onclick="switchTab('trips')" class="bg-blue-700 hover:bg-blue-800 text-white text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 font-bold">
          <i data-lucide="folder" class="w-4 h-4"></i>
          <span>一覧</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ表示エリア -->
  <main id="app-content" class="p-4 max-w-md mx-auto"></main>

  <!-- モーダル表示領域 -->
  <div id="modal-container"></div>

  <!-- 下部タブバー -->
  <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 max-w-md mx-auto z-20">
    <button onclick="switchTab('home')" class="tab-btn flex flex-col items-center text-blue-600" id="tab-home">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-xs mt-1">ホーム</span>
    </button>
    <button onclick="switchTab('itinerary')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-itinerary">
      <i data-lucide="calendar" class="w-5 h-5"></i>
      <span class="text-xs mt-1">旅程</span>
    </button>
    <button onclick="switchTab('belongings')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-belongings">
      <i data-lucide="check-square" class="w-5 h-5"></i>
      <span class="text-xs mt-1">持ち物</span>
    </button>
    <button onclick="switchTab('settlement')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-settlement">
      <i data-lucide="japanese-yen" class="w-5 h-5"></i>
      <span class="text-xs mt-1">精算</span>
    </button>
    <button onclick="switchTab('ai')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-ai">
      <i data-lucide="sparkles" class="w-5 h-5"></i>
      <span class="text-xs mt-1">AI相談</span>
    </button>
  </nav>

  <script>
    const defaultTrips = [
      {
        id: "trip_default_1",
        title: "上海ディズニー",
        destination: "上海",
        startDate: "2026-09-10",
        endDate: "2026-09-12",
        nightsText: "2泊3日",
        daysCount: 3,
        members: ["たろう", "はなこ"],
        currencies: [
          { code: "CNY", rate: 21.5 },
          { code: "USD", rate: 155.0 }
        ],
        activeDay: 1,
        schedule: [
          {
            day: 1,
            date: "1日目",
            events: [
              {
                id: "evt_101",
                type: "spot",
                time: "10:00",
                endTime: "20:00",
                title: "パーク入園チケット",
                url: "https://www.shanghaidisneyresort.com/",
                memo: "チケット画面を事前に準備しておくこと",
                bookingStatus: "reserved",
                expense: 950,
                currency: "CNY",
                paidBy: "たろう",
                forMembers: ["たろう", "はなこ"],
                images: []
              },
              {
                id: "evt_102",
                type: "hotel",
                startDay: 1,
                endDay: 2,
                title: "トイ・ストーリーホテル",
                url: "",
                memo: "15:00チェックイン可能",
                bookingStatus: "reserved",
                expense: 15000,
                currency: "JPY",
                paidBy: "はなこ",
                forMembers: ["たろう", "はなこ"],
                images: []
              }
            ]
          },
          { day: 2, date: "2日目", events: [] },
          { day: 3, date: "3日目", events: [] }
        ],
        belongings: [
          { id: 1, item: "パスポート", checked: true },
          { id: 2, item: "変圧器", checked: false }
        ],
        chatHistory: [
          { sender: 'ai', text: 'こんにちは！旅行特化AIです。何でもご相談ください！' }
        ]
      }
    ];

    let trips = JSON.parse(localStorage.getItem('my_trips')) || defaultTrips;
    let activeTripId = localStorage.getItem('active_trip_id') || trips[0]?.id;
    let openMemberDetails = {};

    function saveTrips() {
      localStorage.setItem('my_trips', JSON.stringify(trips));
      localStorage.setItem('active_trip_id', activeTripId);
    }

    function getCurrentTrip() {
      return trips.find(t => t.id === activeTripId) || trips[0];
    }

    function updateHeader() {
      const trip = getCurrentTrip();
      if (trip) {
        document.getElementById('header-title').innerText = trip.title;
        const dur = trip.nightsText || `${trip.daysCount}日間`;
        const mCount = trip.members ? trip.members.length : 1;
        document.getElementById('header-sub').innerText = `${trip.destination} / ${dur} (${mCount}名)`;
      } else {
        document.getElementById('header-title').innerText = "旅行しおり";
        document.getElementById('header-sub').innerText = "旅行を選択してください";
      }
    }

    // --- 1. 旅行一覧 ＆ 新規・編集機能 ---
    function renderTrips() {
      const tripListHTML = trips.map(t => {
        const isActive = t.id === activeTripId;
        const dur = t.nightsText || `${t.daysCount}日間`;
        const currCodes = t.currencies ? t.currencies.map(c => c.code).join(', ') : 'JPY';
        return `
          <div class="bg-white p-4 rounded-xl border ${isActive ? 'border-blue-500 ring-2 ring-blue-100' : 'border-gray-200'} shadow-sm mb-3 flex justify-between items-center">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="font-bold text-gray-800">${t.title}</h3>
                ${isActive ? '<span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full font-bold">選択中</span>' : ''}
              </div>
              <p class="text-xs text-gray-500 mt-1">📍 ${t.destination} ｜ 🗓 ${dur} ｜ 💱 ${currCodes}</p>
            </div>
            <button onclick="selectTrip('${t.id}')" class="text-xs ${isActive ? 'bg-gray-100 text-gray-400 cursor-default' : 'bg-blue-600 text-white hover:bg-blue-700'} font-bold px-3 py-1.5 rounded-lg">
              ${isActive ? '表示中' : '開く'}
            </button>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          <button onclick="showCreateTripModal()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold p-3.5 rounded-xl shadow flex items-center justify-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span>新しい旅行を作成する</span>
          </button>
          <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">作成済みの旅行一覧</h2>
          <div>${tripListHTML}</div>
        </div>
      `;
    }

    function showCreateTripModal(isEdit = false) {
      const trip = isEdit ? getCurrentTrip() : null;
      const titleVal = trip ? trip.title : '';
      const destVal = trip ? trip.destination : '';
      const startVal = trip ? trip.startDate : '';
      const endVal = trip ? trip.endDate : '';
      const currList = trip && trip.currencies ? trip.currencies : [{ code: 'CNY', rate: 21.5 }];
      const members = trip && trip.members ? trip.members : ['自分', 'メンバー2'];

      let currRowsHTML = currList.map((c, i) => `
        <div class="flex gap-2 items-center curr-row mb-1.5">
          <input type="text" class="curr-code w-24 border rounded-lg p-2 text-sm uppercase focus:border-blue-500" value="${c.code}" placeholder="CNY, USD等">
          <span class="text-xs font-bold text-gray-500">1外貨＝</span>
          <input type="number" step="0.01" class="curr-rate flex-1 border rounded-lg p-2 text-sm focus:border-blue-500" value="${c.rate}" placeholder="例: 21.5">
          <span class="text-xs font-bold text-gray-500">円</span>
          ${i > 0 ? `<button onclick="this.parentElement.remove()" class="text-red-500 text-xs font-bold px-1">✕</button>` : ''}
        </div>
      `).join('');

      const html = `
        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-white p-5 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md my-8 space-y-3">
            <h2 class="text-base font-bold text-gray-800 border-b pb-2">${isEdit ? '⚙️ 旅行設定の変更' : '✈️ 新しい旅行を作成'}</h2>
            
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">旅行タイトル</label>
              <input id="new-title" type="text" value="${titleVal}" placeholder="例：上海ディズニー旅行" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">行き先</label>
              <input id="new-destination" type="text" value="${destVal}" placeholder="例：上海" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="block text-xs font-bold text-gray-600">使用する外貨とレート</label>
                <button onclick="addCurrencyRow()" class="text-[11px] text-blue-600 font-bold hover:underline">+ 通貨を追加</button>
              </div>
              <div id="currency-rows-container">
                ${currRowsHTML}
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">出発日</label>
                <input id="new-start-date" type="date" value="${startVal}" onchange="calculateNights()" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">到着日</label>
                <input id="new-end-date" type="date" value="${endVal}" onchange="calculateNights()" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
              </div>
            </div>

            <div id="nights-display" class="text-xs font-bold text-blue-600 bg-blue-50 p-2 rounded-lg text-center hidden">
              期間: <span id="nights-text"></span>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">人数</label>
              <select id="new-member-count" onchange="updateMemberInputs()" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
                ${[1,2,3,4,5,6].map(n => `<option value="${n}" ${members.length === n ? 'selected' : ''}>${n}名</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">メンバーの名前</label>
              <div id="member-inputs-container" class="space-y-1.5"></div>
            </div>

            <div class="flex gap-2 pt-2 border-t">
              <button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-600 font-bold py-2 rounded-lg text-xs">キャンセル</button>
              <button onclick="saveTripSettings(${isEdit})" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg text-xs hover:bg-blue-700">${isEdit ? '設定を保存' : '作成する'}</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modal-container').innerHTML = html;
      updateMemberInputs(members);
      calculateNights();
    }

    function showEditTripModal() { showCreateTripModal(true); }

    function addCurrencyRow() {
      const container = document.getElementById('currency-rows-container');
      const div = document.createElement('div');
      div.className = "flex gap-2 items-center curr-row mb-1.5";
      div.innerHTML = `
        <input type="text" class="curr-code w-24 border rounded-lg p-2 text-sm uppercase focus:border-blue-500" placeholder="USD, EUR等">
        <span class="text-xs font-bold text-gray-500">1外貨＝</span>
        <input type="number" step="0.01" class="curr-rate flex-1 border rounded-lg p-2 text-sm focus:border-blue-500" placeholder="例: 155.0">
        <span class="text-xs font-bold text-gray-500">円</span>
        <button onclick="this.parentElement.remove()" class="text-red-500 text-xs font-bold px-1">✕</button>
      `;
      container.appendChild(div);
    }

    function calculateNights() {
      const startVal = document.getElementById('new-start-date').value;
      const endVal = document.getElementById('new-end-date').value;
      const display = document.getElementById('nights-display');
      const textSpan = document.getElementById('nights-text');

      if (startVal && endVal) {
        const start = new Date(startVal);
        const end = new Date(endVal);
        const diffTime = end - start;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

        if (diffDays > 0) {
          const nights = diffDays - 1;
          const text = nights === 0 ? "日帰り" : `${nights}泊${diffDays}日`;
          textSpan.innerText = text;
          display.classList.remove('hidden');
          return { nights, days: diffDays, text };
        }
      }
      display.classList.add('hidden');
      return { nights: 0, days: 1, text: '1日' };
    }

    function updateMemberInputs(existingMembers = null) {
      const count = parseInt(document.getElementById('new-member-count').value);
      const container = document.getElementById('member-inputs-container');
      let html = '';
      for (let i = 1; i <= count; i++) {
        let name = existingMembers && existingMembers[i - 1] ? existingMembers[i - 1] : (i === 1 ? '自分' : `メンバー${i}`);
        html += `<input type="text" class="member-name-input w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500" placeholder="名前 ${i}" value="${name}">`;
      }
      container.innerHTML = html;
    }

    function saveTripSettings(isEdit) {
      const title = document.getElementById('new-title').value.trim() || '無題の旅行';
      const destination = document.getElementById('new-destination').value.trim() || '未定';
      const startDate = document.getElementById('new-start-date').value || '';
      const endDate = document.getElementById('new-end-date').value || '';

      const { days, text } = calculateNights();
      const daysCount = days > 0 ? days : 1;

      const currRows = document.querySelectorAll('.curr-row');
      const currencies = [];
      currRows.forEach(row => {
        const code = row.querySelector('.curr-code').value.trim().toUpperCase();
        const rate = parseFloat(row.querySelector('.curr-rate').value) || 1;
        if (code) currencies.push({ code, rate });
      });
      if (currencies.length === 0) currencies.push({ code: 'CNY', rate: 21.5 });

      const memberInputs = document.querySelectorAll('.member-name-input');
      const members = Array.from(memberInputs).map((input, idx) => input.value.trim() || `メンバー${idx + 1}`);

      if (isEdit) {
        const trip = getCurrentTrip();
        trip.title = title;
        trip.destination = destination;
        trip.startDate = startDate;
        trip.endDate = endDate;
        trip.nightsText = text;
        trip.daysCount = daysCount;
        trip.currencies = currencies;
        trip.members = members;

        while (trip.schedule.length < daysCount) {
          const nextDay = trip.schedule.length + 1;
          trip.schedule.push({ day: nextDay, date: `${nextDay}日目`, events: [] });
        }
      } else {
        const schedule = [];
        for (let i = 1; i <= daysCount; i++) {
          schedule.push({ day: i, date: `${i}日目`, events: [] });
        }

        const newTrip = {
          id: 'trip_' + Date.now(),
          title,
          destination,
          startDate,
          endDate,
          nightsText: text,
          daysCount,
          currencies,
          members,
          activeDay: 1,
          schedule,
          belongings: [
            { id: 1, item: "パスポート", checked: false },
            { id: 2, item: "充電器", checked: false }
          ],
          chatHistory: [{ sender: 'ai', text: `「${title}」の計画ですね！何でもご相談ください！` }]
        };
        trips.unshift(newTrip);
        activeTripId = newTrip.id;
      }

      saveTrips();
      closeModal();
      switchTab('home');
    }

    function selectTrip(id) {
      activeTripId = id;
      saveTrips();
      switchTab('home');
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    // --- 2. ホーム画面 ---
    function renderHome() {
      const trip = getCurrentTrip();
      if (!trip) return renderTrips();

      const memberCount = trip.members ? trip.members.length : 1;
      const dur = trip.nightsText || `${trip.daysCount}日間`;
      const currText = trip.currencies ? trip.currencies.map(c => `1 ${c.code}=${c.rate}円`).join(' / ') : '';

      return `
        <div class="space-y-4">
          <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-2xl p-5 shadow-lg">
            <div class="flex justify-between items-start">
              <span class="text-[10px] bg-white/20 backdrop-blur px-2 py-0.5 rounded-full font-semibold">📍 ${trip.destination}</span>
              ${currText ? `<span class="text-[10px] bg-yellow-400 text-gray-900 font-bold px-2 py-0.5 rounded-full">💱 ${currText}</span>` : ''}
            </div>
            <h2 class="text-xl font-bold mt-2">${trip.title}</h2>
            <p class="text-xs text-blue-100 mt-1">🗓 ${dur} / 👥 ${memberCount}名 (${trip.members ? trip.members.join(', ') : ''})</p>
            <div class="mt-4 flex gap-2">
              <button onclick="switchTab('itinerary')" class="bg-white text-blue-700 text-xs px-4 py-2 rounded-xl font-bold shadow-sm">旅程を見よう</button>
              <button onclick="switchTab('ai')" class="bg-blue-500/40 border border-white/30 text-white text-xs px-4 py-2 rounded-xl font-bold flex items-center gap-1">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> AI相談
              </button>
            </div>
          </div>
        </div>`;
    }

    // --- 3. 旅程画面 ---
    function getBookingBadge(status) {
      if (status === 'reserved') {
        return `<span class="text-[10px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded border border-green-300">✅ 予約済み</span>`;
      } else if (status === 'unreserved') {
        return `<span class="text-[10px] bg-red-100 text-red-600 font-bold px-2 py-0.5 rounded border border-red-300">⚠️ 要予約</span>`;
      } else {
        return `<span class="text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded">予約不要</span>`;
      }
    }

    function renderItinerary() {
      const trip = getCurrentTrip();
      if (!trip) return '<div class="text-center text-gray-400 py-8">旅行を選択してください</div>';

      let dayTabsHTML = `<div class="flex space-x-2 mb-4 overflow-x-auto pb-1">`;
      trip.schedule.forEach(s => {
        const activeClass = s.day === trip.activeDay ? "bg-blue-600 text-white" : "bg-white text-gray-600 border";
        dayTabsHTML += `<button onclick="changeDay(${s.day})" class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap shadow-sm ${activeClass}">Day ${s.day}</button>`;
      });
      dayTabsHTML += `</div>`;

      // 現在の日（activeDay）に表示すべき全イベントを収集
      const currentDay = trip.activeDay;
      const dayEvents = [];

      trip.schedule.forEach(s => {
        s.events.forEach(evt => {
          const type = evt.type || 'spot';
          if (type === 'hotel') {
            // 宿泊地：指定された泊数範囲（startDay〜endDay-1）に該当する場合
            const startDay = Number(evt.startDay || 1);
            const endDay = Number(evt.endDay || startDay + 1);
            if (currentDay >= startDay && currentDay < endDay) {
              dayEvents.push(evt);
            }
          } else {
            // スポット・移動：その日に登録されたもの
            if (s.day === currentDay) {
              dayEvents.push(evt);
            }
          }
        });
      });

      // 並び替え（宿泊地は必ず最後尾）
      dayEvents.sort((a, b) => {
        const typeA = a.type || 'spot';
        const typeB = b.type || 'spot';
        if (typeA === 'hotel' && typeB !== 'hotel') return 1;
        if (typeA !== 'hotel' && typeB === 'hotel') return -1;
        return (a.time || '').localeCompare(b.time || '');
      });

      let eventsHTML = `<div class="space-y-3">`;

      if (dayEvents.length === 0) {
        eventsHTML += `
          <div class="text-center py-8 bg-white rounded-xl border border-dashed border-gray-300">
            <p class="text-gray-400 text-xs">まだ予定が入っていません</p>
            <button onclick="openEventModal()" class="mt-2 text-xs text-blue-600 font-bold hover:underline">+ 予定を追加する</button>
          </div>`;
      } else {
        dayEvents.forEach(evt => {
          const type = evt.type || 'spot';
          const evtCurr = evt.currency || 'JPY';

          // 費用コンパクト表示
          let expenseBadge = '';
          if (evt.expense) {
            let yenVal = Number(evt.expense);
            if (evtCurr !== 'JPY') {
              const cObj = trip.currencies?.find(c => c.code === evtCurr);
              const r = cObj ? cObj.rate : 1;
              yenVal = Math.round(Number(evt.expense) * r);
              expenseBadge = `<span class="text-xs font-bold text-green-700 bg-green-50 px-2 py-0.5 rounded border border-green-200">💰 ${evtCurr} ${Number(evt.expense).toLocaleString()} (約¥${yenVal.toLocaleString()})</span>`;
            } else {
              expenseBadge = `<span class="text-xs font-bold text-green-700 bg-green-50 px-2 py-0.5 rounded border border-green-200">💰 ¥${yenVal.toLocaleString()}</span>`;
            }
          }

          // 画像表示
          let imgsHTML = '';
          if (evt.images && evt.images.length > 0) {
            imgsHTML = `<div class="flex gap-1.5 overflow-x-auto mt-2 pb-1">` + 
              evt.images.map(img => `<img src="${img}" class="w-14 h-14 object-cover rounded-lg border border-gray-200 shrink-0">`).join('') +
              `</div>`;
          }

          if (type === 'hotel') {
            // 宿泊カード（最下部固定スタイル）
            eventsHTML += `
              <div onclick="openEventModal('${evt.id}')" class="bg-indigo-50/70 border-2 border-indigo-200 p-4 rounded-xl shadow-sm cursor-pointer hover:border-indigo-400 transition space-y-1.5 mt-4">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-bold text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded-md">🏨 宿泊（Day ${evt.startDay}〜Day ${evt.endDay}）</span>
                  ${getBookingBadge(evt.bookingStatus)}
                </div>
                <h3 class="font-bold text-indigo-950 text-base">${evt.title}</h3>
                ${evt.url ? `<a href="${evt.url}" target="_blank" onclick="event.stopPropagation()" class="text-xs text-blue-600 underline block truncate">🔗 ${evt.url}</a>` : ''}
                ${evt.memo ? `<p class="text-xs text-indigo-900/80 bg-white/80 p-2 rounded">${evt.memo}</p>` : ''}
                ${expenseBadge ? `<div class="pt-0.5">${expenseBadge}</div>` : ''}
                ${imgsHTML}
              </div>`;
          } else if (type === 'move') {
            // 移動カード
            const timeDisplay = evt.endTime ? `${evt.time || ''} 〜 ${evt.endTime}` : (evt.time || '時間未指定');
            eventsHTML += `
              <div onclick="openEventModal('${evt.id}')" class="bg-amber-50/60 border border-amber-200 p-4 rounded-xl shadow-sm cursor-pointer hover:border-amber-400 transition space-y-1.5">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-bold text-amber-700">🚌 移動 ｜ 🕒 ${timeDisplay}</span>
                  ${getBookingBadge(evt.bookingStatus)}
                </div>
                <div class="flex items-center gap-2 text-base font-bold text-gray-800">
                  <span>${evt.fromLoc || '出発地'}</span>
                  <span class="text-amber-500">➔</span>
                  <span>${evt.toLoc || '到着地'}</span>
                </div>
                ${evt.title ? `<p class="text-xs text-gray-600">手段/備考: ${evt.title}</p>` : ''}
                ${evt.url ? `<a href="${evt.url}" target="_blank" onclick="event.stopPropagation()" class="text-xs text-blue-500 underline block truncate">🔗 ${evt.url}</a>` : ''}
                ${evt.memo ? `<p class="text-xs text-gray-500 bg-white p-2 rounded border border-amber-100">${evt.memo}</p>` : ''}
                ${expenseBadge ? `<div class="pt-0.5">${expenseBadge}</div>` : ''}
                ${imgsHTML}
              </div>`;
          } else {
            // スポットカード
            const timeDisplay = evt.endTime ? `${evt.time || '未設定'} 〜 ${evt.endTime}` : (evt.time || '時間未設定');
            eventsHTML += `
              <div onclick="openEventModal('${evt.id}')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer hover:border-blue-300 transition space-y-1.5">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-bold text-blue-600">🕒 ${timeDisplay}</span>
                  ${getBookingBadge(evt.bookingStatus)}
                </div>
                <h3 class="font-bold text-gray-800 text-base">${evt.title}</h3>
                ${evt.url ? `<a href="${evt.url}" target="_blank" onclick="event.stopPropagation()" class="text-xs text-blue-500 underline block truncate">🔗 ${evt.url}</a>` : ''}
                ${evt.memo ? `<p class="text-xs text-gray-500 bg-gray-50 p-2 rounded">${evt.memo}</p>` : ''}
                ${expenseBadge ? `<div class="pt-0.5">${expenseBadge}</div>` : ''}
                ${imgsHTML}
              </div>`;
          }
        });

        eventsHTML += `
          <button onclick="openEventModal()" class="w-full py-3 bg-blue-50 border border-blue-200 text-blue-600 text-xs font-bold rounded-xl flex items-center justify-center gap-1 shadow-sm mt-2">
            <i data-lucide="plus" class="w-4 h-4"></i> 新しい予定を入力・追加
          </button>`;
      }
      eventsHTML += `</div>`;

      return dayTabsHTML + eventsHTML;
    }

    function changeDay(day) {
      const trip = getCurrentTrip();
      if (trip) {
        trip.activeDay = day;
        saveTrips();
        switchTab('itinerary');
      }
    }

    // --- 4. 予定入力・編集モーダル（種別：スポット/宿泊地/移動 対応） ---

        time: '10:00',

        toLoc: '',

        url: '',

        expense: '',

        forMembers: trip.members ? [...trip.members] : ['自分'],

        `<option value="${m}" ${evt.paidBy === m ? 'selected' : ''}>${m}</option>`

      const memberCheckboxes = (trip.members || ['自分']).map(m => {
        const isChecked = evt.forMembers.includes(m) ? 'checked' : '';
        return `
          <label class="inline-flex items-center gap-1 text-xs bg-gray-50 border border-gray-200 px-2 py-1 rounded-lg cursor-pointer">
            <input type="checkbox" value="${m}" ${isChecked} class="evt-for-member-cb rounded text-blue-600">
            <span>${m}</span>

        dayOptionsEnd += `<option value="${d}" ${Number(evt.endDay) === d ? 'selected' : ''}>Day ${d}</option>`;

      const html = `

            </div>

            <!-- 1. スポット用入力 -->
            <div id="field-spot" class="space-y-3">

                <label class="block text-xs font-bold text-gray-600 mb-1">スポット名 <span class="text-red-500">*</span></label>

            <!-- 2. 宿泊地用入力 -->
            <div id="field-hotel" class="space-y-3 hidden">
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">ホテル・宿泊施設名 <span class="text-red-500">*</span></label>
                <input id="evt-title-hotel" type="text" value="${evt.type === 'hotel' ? evt.title : ''}" placeholder="例：トイ・ストーリーホテル" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">

                  <select id="evt-end-day" class="w-full border rounded-lg p-2 text-sm bg-white focus:outline-none focus:border-blue-500">
                    ${dayOptionsEnd}
                  </select>

              </div>
            </div>

            <!-- 3. 移動用入力 -->

                <div>
                  <label class="block text-xs font-bold text-gray-600 mb-1">出発地 <span class="text-red-500">*</span></label>
                  <input id="evt-from-loc" type="text" value="${evt.fromLoc || ''}" placeholder="例：浦東空港" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-600 mb-1">到着地 <span class="text-red-500">*</span></label>
                  <input id="evt-to-loc" type="text" value="${evt.toLoc || ''}" placeholder="例：ホテル" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">移動手段 / 備考</label>
                <input id="evt-title-move" type="text" value="${evt.type === 'move' ? evt.title : ''}" placeholder="例：タクシー、リニアモーターカー" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
              </div>

                <div>
                  <label class="block text-xs font-bold text-gray-600 mb-1">出発時間</label>
                  <input id="evt-move-time" type="time" value="${evt.time || ''}" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-600 mb-1">到着時間</label>
                  <input id="evt-move-end-time" type="time" value="${evt.endTime || ''}" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">予約の有無</label>
              <select id="evt-booking" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
                <option value="unnecessary" ${evt.bookingStatus === 'unnecessary' ? 'selected' : ''}>予約不要</option>
                <option value="reserved" ${evt.bookingStatus === 'reserved' ? 'selected' : ''}>✅ 予約済み</option>
                <option value="unreserved" ${evt.bookingStatus === 'unreserved' ? 'selected' : ''}>⚠️ 要予約</option>
              </select>

            <!-- 写真・スクショ添付エリア（最大6枚） -->

                <span id="img-count-tag" class="text-[10px] text-gray-400">${tempEventImages.length}/6</span>
              </div>
              <div id="image-preview-container" class="flex flex-wrap gap-2 mb-2"></div>
              <input type="file" id="evt-image-input" accept="image/*" multiple onchange="handleImageUpload(event)" class="hidden">
              <button onclick="document.getElementById('evt-image-input').click()" class="w-full py-2 bg-gray-50 border border-gray-300 border-dashed text-gray-600 rounded-lg text-xs font-bold flex items-center justify-center gap-1 hover:bg-gray-100">

                  ${memberPaidOptions}
                </select>

              <label class="block text-xs font-bold text-gray-600 mb-1">メモ</label>
              <textarea id="evt-memo" rows="2" placeholder="持ち物や注意事項など" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">${evt.memo}</textarea>

              <button onclick="saveEvent('${evt.id}')" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg text-xs hover:bg-blue-700">保存する</button>

    let currentSelectedType = 'spot';
    function switchEventType(type) {
      currentSelectedType = type;
      const spotBtn = document.getElementById('type-btn-spot');
      const hotelBtn = document.getElementById('type-btn-hotel');
      const moveBtn = document.getElementById('type-btn-move');

      const spotField = document.getElementById('field-spot');
      const hotelField = document.getElementById('field-hotel');
      const moveField = document.getElementById('field-move');

      [spotBtn, hotelBtn, moveBtn].forEach(btn => btn.className = "py-1.5 text-xs font-bold rounded-lg transition text-gray-500");
      [spotField, hotelField, moveField].forEach(f => f.classList.add('hidden'));

      if (type === 'hotel') {
        hotelBtn.className = "py-1.5 text-xs font-bold rounded-lg transition bg-white text-indigo-700 shadow-sm";
        hotelField.classList.remove('hidden');
      } else if (type === 'move') {
        moveBtn.className = "py-1.5 text-xs font-bold rounded-lg transition bg-white text-amber-700 shadow-sm";
        moveField.classList.remove('hidden');
      } else {
        spotBtn.className = "py-1.5 text-xs font-bold rounded-lg transition bg-white text-blue-600 shadow-sm";
        spotField.classList.remove('hidden');
      }
    }

    function handleImageUpload(e) {
      const files = Array.from(e.target.files);
      if (tempEventImages.length + files.length > 6) {
        alert('写真は最大6枚まで選択可能です！');
        return;
      }

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          if (tempEventImages.length < 6) {
            tempEventImages.push(evt.target.result);
            renderImagePreviews();
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function removeTempImage(idx) {
      tempEventImages.splice(idx, 1);
      renderImagePreviews();
    }

    function renderImagePreviews() {
      const container = document.getElementById('image-preview-container');
      const tag = document.getElementById('img-count-tag');
      if (!container) return;

      tag.innerText = `${tempEventImages.length}/6`;
      container.innerHTML = tempEventImages.map((img, idx) => `
        <div class="relative w-16 h-16">
          <img src="${img}" class="w-full h-full object-cover rounded-lg border border-gray-200">
          <button onclick="removeTempImage(${idx})" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full w-5 h-5 text-[10px] flex items-center justify-center font-bold shadow">✕</button>
        </div>
      `).join('');
    }

    function saveEvent(eventId) {
      const type = currentSelectedType;
      let title = '';
      let time = '', endTime = '';
      let startDay = 1, endDay = 2;
      let fromLoc = '', toLoc = '';

      if (type === 'hotel') {
        title = document.getElementById('evt-title-hotel').value.trim();
        startDay = Number(document.getElementById('evt-start-day').value);
        endDay = Number(document.getElementById('evt-end-day').value);
        if (!title) { alert('ホテル・宿泊施設名を入力してください！'); return; }
        if (startDay >= endDay) { alert('チェックアウト日（Day）はチェックイン日より後に設定してください！'); return; }
      } else if (type === 'move') {
        fromLoc = document.getElementById('evt-from-loc').value.trim();
        toLoc = document.getElementById('evt-to-loc').value.trim();
        title = document.getElementById('evt-title-move').value.trim();
        time = document.getElementById('evt-move-time').value;
        endTime = document.getElementById('evt-move-end-time').value;
        if (!fromLoc || !toLoc) { alert('出発地と到着地の両方を入力してください！'); return; }
      } else {
        title = document.getElementById('evt-title-spot').value.trim();
        time = document.getElementById('evt-time').value;
        endTime = document.getElementById('evt-end-time').value;
        if (!title) { alert('スポット名を入力してください！'); return; }
      }

      const trip = getCurrentTrip();
      const currentSchedule = trip.schedule.find(s => s.day === trip.activeDay);
      
      // 既存のイベントを探して削除（日を跨ぐ可能性があるため全スケジュールから検索）
      trip.schedule.forEach(s => {
        s.events = s.events.filter(e => e.id !== eventId);
      });

      const selectedForMembers = Array.from(document.querySelectorAll('.evt-for-member-cb:checked')).map(cb => cb.value);

      const eventData = {
        id: eventId,
        type,
        title,
        time,
        endTime,
        startDay,
        endDay,
        fromLoc,
        toLoc,
        bookingStatus: document.getElementById('evt-booking').value,
        expense: document.getElementById('evt-expense').value,
        currency: document.getElementById('evt-currency').value,
        paidBy: document.getElementById('evt-paidBy').value,
        forMembers: selectedForMembers,
        url: document.getElementById('evt-url').value.trim(),
        memo: document.getElementById('evt-memo').value.trim(),
        images: [...tempEventImages]
      };

      currentSchedule.events.push(eventData);

      saveTrips();
      closeModal();
      switchTab('itinerary');
    }

    function deleteEvent(eventId) {
      if (!confirm('この予定を削除してもよろしいですか？')) return;
      const trip = getCurrentTrip();
      trip.schedule.forEach(s => {
        s.events = s.events.filter(e => e.id !== eventId);
      });

      saveTrips();
      closeModal();
      switchTab('itinerary');
    }

    // --- 5. 精算画面 ---
    function toggleMemberDetail(memberName) {
      openMemberDetails[memberName] = !openMemberDetails[memberName];
      switchTab('settlement');
    }

    function renderSettlement() {
      const trip = getCurrentTrip();
      if (!trip) return '';

      const members = trip.members || ['自分'];
      const activeCurrencies = (trip.currencies || []).map(c => c.code);
      if (!activeCurrencies.includes('JPY')) activeCurrencies.push('JPY');

      const stats = {};
      activeCurrencies.forEach(c => {
        stats[c] = { total: 0, paid: {}, share: {} };
        members.forEach(m => { stats[c].paid[m] = 0; stats[c].share[m] = 0; });
      });

      const memberPaidEvents = {};
      members.forEach(m => memberPaidEvents[m] = []);

      trip.schedule.forEach(s => {
        s.events.forEach(e => {
          if (e.expense) {
            const amt = Number(e.expense);
            const c = e.currency || 'JPY';

            if (!stats[c]) {
              stats[c] = { total: 0, paid: {}, share: {} };
              members.forEach(m => { stats[c].paid[m] = 0; stats[c].share[m] = 0; });
            }

            stats[c].total += amt;

            if (e.paidBy) {
              if (stats[c].paid[e.paidBy] !== undefined) stats[c].paid[e.paidBy] += amt;
              if (memberPaidEvents[e.paidBy]) memberPaidEvents[e.paidBy].push({ ...e, day: s.day });
            }

            const targetMembers = e.forMembers && e.forMembers.length > 0 ? e.forMembers : members;
            const splitAmt = amt / targetMembers.length;
            targetMembers.forEach(tm => {
              if (stats[c].share[tm] !== undefined) stats[c].share[tm] += splitAmt;
            });
          }
        });
      });

      const rateMap = { JPY: 1 };
      (trip.currencies || []).forEach(c => rateMap[c.code] = c.rate);

      let grandTotalYen = 0;
      Object.keys(stats).forEach(c => {
        const r = rateMap[c] || 1;
        grandTotalYen += stats[c].total * r;
      });

      const memberDetailsHTML = members.map(m => {
        let diffJpyTotal = 0;
        let currencyBreakdownHTML = '';

        activeCurrencies.forEach(c => {
          const paid = stats[c]?.paid[m] || 0;
          const share = stats[c]?.share[m] || 0;
          const diff = paid - share;
          const r = rateMap[c] || 1;

          diffJpyTotal += (diff * r);

          if (paid > 0 || share > 0) {
            const diffSign = diff > 0 ? `＋${c} ${Math.round(diff).toLocaleString()}` : (diff < 0 ? `－${c} ${Math.abs(Math.round(diff)).toLocaleString()}` : `${c} 0`);
            const diffColor = diff > 0 ? 'text-green-600' : (diff < 0 ? 'text-red-600' : 'text-gray-500');

            currencyBreakdownHTML += `
              <div class="text-[11px] text-gray-600 flex justify-between items-center border-t border-gray-100 pt-1 mt-1">
                <span><b>${c}</b> (立替: ${Math.round(paid).toLocaleString()} / 負担: ${Math.round(share).toLocaleString()})</span>
                <span class="font-bold ${diffColor}">${diffSign}</span>
              </div>
            `;
          }
        });

        let finalBadge = '';
        if (Math.round(diffJpyTotal) > 0) {
          finalBadge = `<span class="text-xs font-bold text-green-700 bg-green-100 px-2.5 py-1 rounded-full">最終: ＋¥${Math.round(diffJpyTotal).toLocaleString()} (受取)</span>`;
        } else if (Math.round(diffJpyTotal) < 0) {
          finalBadge = `<span class="text-xs font-bold text-red-700 bg-red-100 px-2.5 py-1 rounded-full">最終: －¥${Math.abs(Math.round(diffJpyTotal)).toLocaleString()} (支払)</span>`;
        } else {
          finalBadge = `<span class="text-xs font-bold text-gray-500 bg-gray-100 px-2.5 py-1 rounded-full">最終: ¥0 (清算なし)</span>`;
        }

        const isExpanded = !!openMemberDetails[m];
        const paidItems = memberPaidEvents[m] || [];
        let paidItemsHTML = '';

        if (isExpanded) {
          if (paidItems.length === 0) {
            paidItemsHTML = `<div class="bg-gray-50 p-2.5 rounded-lg text-xs text-gray-400 mt-2">立替・支払った予定はありません</div>`;
          } else {
            paidItemsHTML = `
              <div class="bg-blue-50/60 p-2.5 rounded-xl text-xs space-y-2 mt-2 border border-blue-100">
                <span class="font-bold text-blue-900 block border-b border-blue-200/60 pb-1">💳 ${m} が支払った明細（全${paidItems.length}件）</span>
                <div class="space-y-1.5">
                  ${paidItems.map(item => `
                    <div class="flex justify-between items-center bg-white p-2 rounded-lg shadow-sm">
                      <div>
                        <span class="font-bold text-gray-800 block">${item.title || (item.fromLoc + ' ➔ ' + item.toLoc)}</span>
                        <span class="text-[10px] text-gray-400">Day ${item.day} / 対象: ${item.forMembers?.join(', ') || '全員'}</span>
                      </div>
                      <span class="font-bold text-green-700 shrink-0">${item.currency || 'JPY'} ${Number(item.expense).toLocaleString()}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }
        }

        return `
          <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm transition">
            <div onclick="toggleMemberDetail('${m}')" class="flex justify-between items-center cursor-pointer">
              <div class="flex items-center gap-1.5">
                <span class="font-bold text-gray-800 text-sm">👤 ${m}</span>
                <span class="text-[10px] text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">${isExpanded ? '▲ 閉じる' : '▼ 支払一覧'}</span>
              </div>
              ${finalBadge}
            </div>
            ${currencyBreakdownHTML || '<p class="text-[11px] text-gray-400 mt-1">登録された費用はありません</p>'}
            ${paidItemsHTML}
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 rounded-xl shadow">
            <p class="text-xs text-blue-100">旅程に登録された総費用（円換算合計）</p>
            <p class="text-2xl font-bold mt-0.5">約 ¥${Math.round(grandTotalYen).toLocaleString()}</p>
            <div class="text-[11px] text-blue-100 mt-2 flex flex-wrap gap-3 border-t border-blue-400/50 pt-1.5">
              ${Object.keys(stats).map(c => `<span>${c}: <b>${stats[c].total.toLocaleString()}</b></span>`).join('')}
            </div>
          </div>

          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">メンバー別 精算バランス</h3>
            <span class="text-[10px] text-gray-400">※名をタップで立替明細を表示</span>
          </div>

          <div class="space-y-2.5">
            ${memberDetailsHTML}
          </div>
        </div>`;
    }

    // --- 6. AI相談画面 ---
    function renderAI() {
      const trip = getCurrentTrip();
      if (!trip) return '';

      if (!trip.chatHistory) {
        trip.chatHistory = [{ sender: 'ai', text: 'こんにちは！旅行特化AIです。何でもご相談ください！' }];
      }

      let chatLogs = trip.chatHistory.map(msg => {
        if (msg.sender === 'user') {
          return `<div class="flex justify-end mb-3"><div class="bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none text-xs max-w-[80%]">${msg.text}</div></div>`;
        } else {
          return `
            <div class="flex justify-start mb-3 gap-2">
              <div class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xs font-bold shrink-0">AI</div>
              <div class="bg-white border p-3 rounded-2xl rounded-tl-none text-xs max-w-[85%] shadow-sm text-gray-800 whitespace-pre-wrap">${msg.text}</div>
            </div>`;
        }
      }).join('');

      return `
        <div class="flex flex-col h-[calc(100vh-140px)]">
          <div class="bg-blue-50 border border-blue-200 rounded-xl p-2.5 mb-3 flex items-center gap-2">
            <i data-lucide="sparkles" class="w-4 h-4 text-blue-600 shrink-0"></i>
            <p class="text-[11px] text-blue-800 leading-tight">現在AI機能はデモモードです。</p>
          </div>

          <div class="flex-1 overflow-y-auto pr-1" id="chat-box">
            ${chatLogs}
          </div>
          <div class="mt-2 flex gap-2">
            <input id="ai-input" type="text" placeholder="おすすめのランチ教えて！など" class="flex-1 border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
            <button onclick="sendAIMessage()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold shrink-0">送信</button>
          </div>
        </div>
      `;
    }

    function sendAIMessage() {
      const input = document.getElementById('ai-input');
      const val = input.value.trim();
      if (!val) return;

      const trip = getCurrentTrip();
      if (!trip.chatHistory) trip.chatHistory = [];

      trip.chatHistory.push({ sender: 'user', text: val });
      
      setTimeout(() => {
        const dummyReply = `「${val}」ですね！\n「${trip.title}」（${trip.destination}）の旅程に合わせて提案します！`;
        trip.chatHistory.push({ sender: 'ai', text: dummyReply });
        saveTrips();
        switchTab('ai');
      }, 400);

      saveTrips();
      switchTab('ai');
    }

    // --- 7. 持ち物画面 ---
    function renderBelongings() {
      const trip = getCurrentTrip();
      if (!trip) return '';

      return `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-sm font-bold text-gray-700">持ち物チェックリスト</h2>
          </div>
          <div class="space-y-2">
            ${trip.belongings.map(b => `
              <label class="flex items-center justify-between text-sm p-2 hover:bg-gray-50 rounded border-b border-gray-50 last:border-none">
                <div class="flex items-center gap-2">
                  <input type="checkbox" ${b.checked ? 'checked' : ''} onchange="toggleBelonging(${b.id})" class="w-4 h-4 text-blue-600 rounded">
                  <span class="${b.checked ? 'line-through text-gray-400' : 'text-gray-700'}">${b.item}</span>
                </div>
              </label>
            `).join('')}
          </div>
          <button onclick="addBelongingPrompt()" class="mt-3 w-full py-2 text-xs text-blue-600 font-bold bg-blue-50 rounded-lg hover:bg-blue-100">+ 持ち物を追加</button>
        </div>`;
    }

    function toggleBelonging(id) {
      const trip = getCurrentTrip();
      const item = trip.belongings.find(b => b.id === id);
      if (item) {
        item.checked = !item.checked;
        saveTrips();
        switchTab('belongings');
      }
    }

    function addBelongingPrompt() {
      const item = prompt("追加する持ち物名");
      if (!item) return;
      const trip = getCurrentTrip();
      trip.belongings.push({ id: Date.now(), item, checked: false });
      saveTrips();
      switchTab('belongings');
    }

    // --- タブ切り替え ---
    const views = {
      home: renderHome,
      itinerary: renderItinerary,
      belongings: renderBelongings,
      settlement: renderSettlement,
      ai: renderAI,
      trips: renderTrips
    };

    function switchTab(tabName) {
      updateHeader();
      document.getElementById('app-content').innerHTML = views[tabName]();
      
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('text-blue-600');
        btn.classList.add('text-gray-400');
      });

      const activeTabBtn = document.getElementById(`tab-${tabName}`);
      if (activeTabBtn) {
        activeTabBtn.classList.remove('text-gray-400');
        activeTabBtn.classList.add('text-blue-600');
      }

      lucide.createIcons();
    }

    switchTab('home');
  </script>
</body>
</html>
