<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabiori 風 旅行しおりアプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-24">

  <!-- ヘッダー -->
  <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 id="header-title" class="text-lg font-bold">旅行しおり</h1>
        <p id="header-sub" class="text-xs text-blue-100">旅行を選択してください</p>
      </div>
      <button onclick="switchTab('trips')" class="bg-blue-700 hover:bg-blue-800 text-white text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 font-bold">
        <i data-lucide="folder" class="w-4 h-4"></i>
        <span>一覧</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ表示エリア -->
  <main id="app-content" class="p-4 max-w-md mx-auto">
    <!-- JSで切り替えます -->
  </main>

  <!-- モーダル表示領域 -->
  <div id="modal-container"></div>

  <!-- 下部タブバー -->
  <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 max-w-md mx-auto z-20">
    <button onclick="switchTab('home')" class="tab-btn flex flex-col items-center text-blue-600" id="tab-home">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-xs mt-1">ホーム</span>
    </button>
    <button onclick="switchTab('itinerary')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-itinerary">
      <i data-lucide="calendar" class="w-5 h-5"></i>
      <span class="text-xs mt-1">旅程</span>
    </button>
    <button onclick="switchTab('belongings')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-belongings">
      <i data-lucide="check-square" class="w-5 h-5"></i>
      <span class="text-xs mt-1">持ち物</span>
    </button>
    <button onclick="switchTab('settlement')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-settlement">
      <i data-lucide="japanese-yen" class="w-5 h-5"></i>
      <span class="text-xs mt-1">精算</span>
    </button>
    <button onclick="switchTab('ai')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-ai">
      <i data-lucide="sparkles" class="w-5 h-5"></i>
      <span class="text-xs mt-1">AI相談</span>
    </button>
  </nav>

  <script>
    // 初期サンプルデータ
    const defaultTrips = [
      {
        id: "trip_default_1",
        title: "上海ディズニー",
        destination: "上海",
        startDate: "2026-09-10",
        endDate: "2026-09-12",
        nightsText: "2泊3日",
        daysCount: 3,
        members: ["たろう", "はなこ"],
        currency: "CNY",
        exchangeRate: 21.5, // 1 CNY = 21.5 JPY
        activeDay: 1,
        schedule: [
          {
            day: 1,
            date: "1日目",
            events: [
              {
                id: "evt_101",
                time: "10:00",
                endTime: "20:00",
                title: "パーク入園チケット",
                url: "https://www.shanghaidisneyresort.com/",
                memo: "チケット画面を事前に準備しておくこと",
                bookingStatus: "reserved",
                expense: 950,
                currency: "CNY",
                paidBy: "たろう",
                forMembers: ["たろう", "はなこ"]
              },
              {
                id: "evt_102",
                time: "12:30",
                endTime: "13:30",
                title: "事前カード決済ホテル代",
                url: "",
                memo: "日本で事前決済済み",
                bookingStatus: "reserved",
                expense: 15000,
                currency: "JPY",
                paidBy: "はなこ",
                forMembers: ["たろう", "はなこ"]
              }
            ]
          },
          { day: 2, date: "2日目", events: [] },
          { day: 3, date: "3日目", events: [] }
        ],
        belongings: [
          { id: 1, item: "パスポート", checked: true },
          { id: 2, item: "変圧器", checked: false }
        ],
        chatHistory: [
          { sender: 'ai', text: 'こんにちは！旅行特化AIです。何でもご相談ください！' }
        ]
      }
    ];

    let trips = JSON.parse(localStorage.getItem('my_trips')) || defaultTrips;
    let activeTripId = localStorage.getItem('active_trip_id') || trips[0]?.id;

    function saveTrips() {
      localStorage.setItem('my_trips', JSON.stringify(trips));
      localStorage.setItem('active_trip_id', activeTripId);
    }

    function getCurrentTrip() {
      return trips.find(t => t.id === activeTripId) || trips[0];
    }

    function updateHeader() {
      const trip = getCurrentTrip();
      if (trip) {
        document.getElementById('header-title').innerText = trip.title;
        const dur = trip.nightsText || `${trip.daysCount}日間`;
        const mCount = trip.members ? trip.members.length : 1;
        document.getElementById('header-sub').innerText = `${trip.destination} / ${dur} (${mCount}名)`;
      } else {
        document.getElementById('header-title').innerText = "旅行しおり";
        document.getElementById('header-sub').innerText = "旅行を選択してください";
      }
    }

    // --- 1. 旅行一覧 ＆ 新規作成 ---
    function renderTrips() {
      const tripListHTML = trips.map(t => {
        const isActive = t.id === activeTripId;
        const memberCount = t.members ? t.members.length : 1;
        const dur = t.nightsText || `${t.daysCount}日間`;
        const curr = t.currency || 'JPY';
        return `
          <div class="bg-white p-4 rounded-xl border ${isActive ? 'border-blue-500 ring-2 ring-blue-100' : 'border-gray-200'} shadow-sm mb-3 flex justify-between items-center">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="font-bold text-gray-800">${t.title}</h3>
                ${isActive ? '<span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full font-bold">選択中</span>' : ''}
              </div>
              <p class="text-xs text-gray-500 mt-1">📍 ${t.destination} ｜ 🗓 ${dur} ｜ 💱 ${curr}</p>
            </div>
            <button onclick="selectTrip('${t.id}')" class="text-xs ${isActive ? 'bg-gray-100 text-gray-400 cursor-default' : 'bg-blue-600 text-white hover:bg-blue-700'} font-bold px-3 py-1.5 rounded-lg">
              ${isActive ? '表示中' : '開く'}
            </button>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          <button onclick="showCreateTripModal()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold p-3.5 rounded-xl shadow flex items-center justify-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span>新しい旅行を作成する</span>
          </button>
          <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">作成済みの旅行一覧</h2>
          <div>${tripListHTML}</div>
        </div>
      `;
    }

    function showCreateTripModal() {
      const html = `
        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-white p-5 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md my-8 space-y-3">
            <h2 class="text-base font-bold text-gray-800 border-b pb-2">✈️ 新しい旅行を作成</h2>
            
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">旅行タイトル</label>
              <input id="new-title" type="text" placeholder="例：上海ディズニー旅行" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">行き先</label>
              <input id="new-destination" type="text" placeholder="例：上海" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">メイン通貨</label>
                <select id="new-currency" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500" onchange="toggleCustomRateInput()">
                  <option value="JPY">日本円 (JPY)</option>
                  <option value="USD">米ドル (USD)</option>
                  <option value="EUR">ユーロ (EUR)</option>
                  <option value="CNY" selected>中国元 (CNY)</option>
                  <option value="KRW">韓国ウォン (KRW)</option>
                  <option value="TWD">台湾ドル (TWD)</option>
                  <option value="THB">タイバーツ (THB)</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">1外貨＝約何円？(レート)</label>
                <input id="new-rate" type="number" step="0.01" value="21.5" placeholder="例: 21.5" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">出発日</label>
                <input id="new-start-date" type="date" onchange="calculateNights()" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">到着日</label>
                <input id="new-end-date" type="date" onchange="calculateNights()" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
              </div>
            </div>

            <div id="nights-display" class="text-xs font-bold text-blue-600 bg-blue-50 p-2 rounded-lg text-center hidden">
              期間: <span id="nights-text"></span>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">人数</label>
              <select id="new-member-count" onchange="updateMemberInputs()" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
                <option value="1">1名</option>
                <option value="2" selected>2名</option>
                <option value="3">3名</option>
                <option value="4">4名</option>
                <option value="5">5名</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">メンバーの名前</label>
              <div id="member-inputs-container" class="space-y-1.5"></div>
            </div>

            <div class="flex gap-2 pt-2 border-t">
              <button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-600 font-bold py-2 rounded-lg text-xs">キャンセル</button>
              <button onclick="createNewTrip()" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg text-xs hover:bg-blue-700">作成する</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modal-container').innerHTML = html;
      updateMemberInputs();
    }

    function toggleCustomRateInput() {
      const curr = document.getElementById('new-currency').value;
      const rateInput = document.getElementById('new-rate');
      if (curr === 'JPY') {
        rateInput.value = '1';
        rateInput.disabled = true;
      } else {
        rateInput.disabled = false;
        if (curr === 'USD') rateInput.value = '155.0';
        else if (curr === 'EUR') rateInput.value = '165.0';
        else if (curr === 'CNY') rateInput.value = '21.5';
        else if (curr === 'KRW') rateInput.value = '0.11';
        else if (curr === 'TWD') rateInput.value = '4.8';
        else if (curr === 'THB') rateInput.value = '4.3';
      }
    }

    function calculateNights() {
      const startVal = document.getElementById('new-start-date').value;
      const endVal = document.getElementById('new-end-date').value;
      const display = document.getElementById('nights-display');
      const textSpan = document.getElementById('nights-text');

      if (startVal && endVal) {
        const start = new Date(startVal);
        const end = new Date(endVal);
        const diffTime = end - start;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

        if (diffDays > 0) {
          const nights = diffDays - 1;
          const text = nights === 0 ? "日帰り" : `${nights}泊${diffDays}日`;
          textSpan.innerText = text;
          display.classList.remove('hidden');
          return { nights, days: diffDays, text };
        }
      }
      display.classList.add('hidden');
      return { nights: 0, days: 1, text: '1日' };
    }

    function updateMemberInputs() {
      const count = parseInt(document.getElementById('new-member-count').value);
      const container = document.getElementById('member-inputs-container');
      let html = '';
      for (let i = 1; i <= count; i++) {
        const defaultName = i === 1 ? '自分' : `メンバー${i}`;
        html += `<input type="text" class="member-name-input w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500" placeholder="名前 ${i}" value="${defaultName}">`;
      }
      container.innerHTML = html;
    }

    function createNewTrip() {
      const title = document.getElementById('new-title').value.trim() || '無題の旅行';
      const destination = document.getElementById('new-destination').value.trim() || '未定';
      const currency = document.getElementById('new-currency').value;
      const exchangeRate = parseFloat(document.getElementById('new-rate').value) || 1;
      const startDate = document.getElementById('new-start-date').value || '';
      const endDate = document.getElementById('new-end-date').value || '';
      
      const { days, text } = calculateNights();
      const daysCount = days > 0 ? days : 1;

      const memberInputs = document.querySelectorAll('.member-name-input');
      const members = Array.from(memberInputs).map((input, idx) => input.value.trim() || `メンバー${idx + 1}`);

      const schedule = [];
      for (let i = 1; i <= daysCount; i++) {
        schedule.push({ day: i, date: `${i}日目`, events: [] });
      }

      const newTrip = {
        id: 'trip_' + Date.now(),
        title,
        destination,
        currency,
        exchangeRate,
        startDate,
        endDate,
        nightsText: text,
        daysCount,
        members,
        activeDay: 1,
        schedule,
        belongings: [
          { id: 1, item: "パスポート", checked: false },
          { id: 2, item: "充電器", checked: false }
        ],
        chatHistory: [
          { sender: 'ai', text: `「${title}」の計画ですね！通貨は ${currency} で設定しました。` }
        ]
      };

      trips.unshift(newTrip);
      activeTripId = newTrip.id;
      saveTrips();
      closeModal();
      switchTab('home');
    }

    function selectTrip(id) {
      activeTripId = id;
      saveTrips();
      switchTab('home');
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    // --- 2. ホーム画面 ---
    function renderHome() {
      const trip = getCurrentTrip();
      if (!trip) return renderTrips();

      const memberCount = trip.members ? trip.members.length : 1;
      const dur = trip.nightsText || `${trip.daysCount}日間`;

      return `
        <div class="space-y-4">
          <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-2xl p-5 shadow-lg">
            <div class="flex justify-between items-start">
              <span class="text-[10px] bg-white/20 backdrop-blur px-2 py-0.5 rounded-full font-semibold">📍 ${trip.destination}</span>
              <span class="text-[10px] bg-yellow-400 text-gray-900 font-bold px-2 py-0.5 rounded-full">💱 1 ${trip.currency || 'JPY'} = ${trip.exchangeRate || 1} JPY</span>
            </div>
            <h2 class="text-xl font-bold mt-2">${trip.title}</h2>
            <p class="text-xs text-blue-100 mt-1">🗓 ${dur} / 👥 ${memberCount}名 (${trip.members ? trip.members.join(', ') : ''})</p>
            <div class="mt-4 flex gap-2">
              <button onclick="switchTab('itinerary')" class="bg-white text-blue-700 text-xs px-4 py-2 rounded-xl font-bold shadow-sm">旅程を見よう</button>
              <button onclick="switchTab('ai')" class="bg-blue-500/40 border border-white/30 text-white text-xs px-4 py-2 rounded-xl font-bold flex items-center gap-1">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> AI相談
              </button>
            </div>
          </div>
        </div>`;
    }

    // --- 3. 旅程画面 ---
    function getBookingBadge(status) {
      if (status === 'reserved') {
        return `<span class="text-[10px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded border border-green-300">✅ 予約済み</span>`;
      } else if (status === 'unreserved') {
        return `<span class="text-[10px] bg-red-100 text-red-600 font-bold px-2 py-0.5 rounded border border-red-300">⚠️ 予約未完了</span>`;
      } else {
        return `<span class="text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded">予約不要</span>`;
      }
    }

    function renderItinerary() {
      const trip = getCurrentTrip();
      if (!trip) return '<div class="text-center text-gray-400 py-8">旅行を選択してください</div>';

      let dayTabsHTML = `<div class="flex space-x-2 mb-4 overflow-x-auto pb-1">`;
      trip.schedule.forEach(s => {
        const activeClass = s.day === trip.activeDay ? "bg-blue-600 text-white" : "bg-white text-gray-600 border";
        dayTabsHTML += `<button onclick="changeDay(${s.day})" class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap shadow-sm ${activeClass}">Day ${s.day}</button>`;
      });
      dayTabsHTML += `</div>`;

      const currentSchedule = trip.schedule.find(s => s.day === trip.activeDay);
      let eventsHTML = `<div class="space-y-3">`;

      if (!currentSchedule || currentSchedule.events.length === 0) {
        eventsHTML += `
          <div class="text-center py-8 bg-white rounded-xl border border-dashed border-gray-300">
            <p class="text-gray-400 text-xs">まだ予定が入っていません</p>
            <button onclick="openEventModal()" class="mt-2 text-xs text-blue-600 font-bold hover:underline">+ 予定を追加する</button>
          </div>`;
      } else {
        currentSchedule.events.forEach(evt => {
          const forMemText = evt.forMembers && evt.forMembers.length > 0 ? evt.forMembers.join(', ') : '全員';
          const timeDisplay = evt.endTime ? `${evt.time || '未設定'} 〜 ${evt.endTime}` : (evt.time || '時間未設定');
          const evtCurr = evt.currency || trip.currency || 'JPY';

          // 円換算表示の事前計算
          let yenCalcText = "";
          if (evt.expense) {
            if (evtCurr === 'JPY') {
              yenCalcText = `(¥${Number(evt.expense).toLocaleString()})`;
            } else {
              const yenVal = Math.round(Number(evt.expense) * (trip.exchangeRate || 1));
              yenCalcText = `(約 ¥${yenVal.toLocaleString()})`;
            }
          }

          eventsHTML += `
            <div onclick="openEventModal('${evt.id}')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer hover:border-blue-300 transition">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold text-blue-600">🕒 ${timeDisplay}</span>
                ${getBookingBadge(evt.bookingStatus)}
              </div>
              <h3 class="font-bold text-gray-800 text-base">${evt.title}</h3>
              
              ${evt.url ? `<a href="${evt.url}" target="_blank" onclick="event.stopPropagation()" class="text-xs text-blue-500 underline mt-0.5 block truncate">🔗 ${evt.url}</a>` : ''}
              ${evt.memo ? `<p class="text-xs text-gray-500 bg-gray-50 p-2 rounded mt-2">${evt.memo}</p>` : ''}
              
              ${evt.expense ? `
                <div class="mt-2 text-xs bg-green-50 text-green-700 p-2.5 rounded border border-green-200 space-y-1">
                  <div class="flex justify-between items-center font-bold">
                    <span>💰 費用: ${evtCurr} ${Number(evt.expense).toLocaleString()} <span class="text-[11px] font-normal text-green-600">${yenCalcText}</span></span>
                    <span>支払者: ${evt.paidBy || '未設定'}</span>
                  </div>
                  <div class="text-[11px] text-green-600 border-t border-green-200/60 pt-1">
                    👥 対象メンバー: <b>${forMemText}</b>
                  </div>
                </div>` : ''}
            </div>`;
        });
        eventsHTML += `
          <button onclick="openEventModal()" class="w-full py-3 bg-blue-50 border border-blue-200 text-blue-600 text-xs font-bold rounded-xl flex items-center justify-center gap-1 shadow-sm">
            <i data-lucide="plus" class="w-4 h-4"></i> 新しい予定を入力・追加
          </button>`;
      }
      eventsHTML += `</div>`;

      return dayTabsHTML + eventsHTML;
    }

    function changeDay(day) {
      const trip = getCurrentTrip();
      if (trip) {
        trip.activeDay = day;
        saveTrips();
        switchTab('itinerary');
      }
    }

    // --- 4. 予定入力・編集モーダル（通貨選択対応） ---
    function openEventModal(eventId = null) {
      const trip = getCurrentTrip();
      const currentSchedule = trip.schedule.find(s => s.day === trip.activeDay);
      
      let evt = {
        id: 'evt_' + Date.now(),
        time: '10:00',
        endTime: '12:00',
        title: '',
        url: '',
        memo: '',
        bookingStatus: 'unnecessary',
        expense: '',
        currency: trip.currency || 'JPY',
        paidBy: trip.members ? trip.members[0] : '自分',
        forMembers: trip.members ? [...trip.members] : ['自分']
      };

      if (eventId) {
        const found = currentSchedule.events.find(e => e.id === eventId);
        if (found) {
          evt = { ...found };
          if (!evt.currency) evt.currency = trip.currency || 'JPY';
          if (!evt.forMembers) evt.forMembers = trip.members ? [...trip.members] : ['自分'];
        }
      }

      const memberPaidOptions = (trip.members || ['自分']).map(m => 
        `<option value="${m}" ${evt.paidBy === m ? 'selected' : ''}>${m}</option>`
      ).join('');

      const memberCheckboxes = (trip.members || ['自分']).map(m => {
        const isChecked = evt.forMembers.includes(m) ? 'checked' : '';
        return `
          <label class="inline-flex items-center gap-1.5 text-xs bg-gray-50 border border-gray-200 px-2.5 py-1 rounded-lg cursor-pointer">
            <input type="checkbox" value="${m}" ${isChecked} class="evt-for-member-cb rounded text-blue-600">
            <span>${m}</span>
          </label>
        `;
      }).join('');

      const mainCurr = trip.currency || 'CNY';

      const html = `
        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-white p-5 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md my-8 space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
              <h2 class="text-base font-bold text-gray-800">${eventId ? '予定の編集' : '新しい予定の入力'}</h2>
              <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">スポット名 / 予定 <span class="text-red-500">*</span></label>
              <input id="evt-title" type="text" value="${evt.title}" placeholder="例：上海ディズニー、レストラン" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">開始時間</label>
                <input id="evt-time" type="time" value="${evt.time || ''}" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">終了時間</label>
                <input id="evt-end-time" type="time" value="${evt.endTime || ''}" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">予約の有無</label>
              <select id="evt-booking" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
                <option value="unnecessary" ${evt.bookingStatus === 'unnecessary' ? 'selected' : ''}>予約不要</option>
                <option value="reserved" ${evt.bookingStatus === 'reserved' ? 'selected' : ''}>✅ 予約済み</option>
                <option value="unreserved" ${evt.bookingStatus === 'unreserved' ? 'selected' : ''}>⚠️ 予約未完了（要予約）</option>
              </select>
            </div>

            <div class="border-t border-b py-2 space-y-2 bg-gray-50/50 -mx-5 px-5">
              <span class="text-xs font-bold text-green-700 block">💰 費用・負担管理</span>
              <div class="grid grid-cols-3 gap-2">
                <div class="col-span-1">
                  <label class="block text-[11px] font-bold text-gray-600 mb-1">通貨</label>
                  <select id="evt-currency" class="w-full border rounded-lg p-2 text-sm bg-white focus:outline-none focus:border-blue-500">
                    <option value="${mainCurr}" ${evt.currency === mainCurr ? 'selected' : ''}>${mainCurr}</option>
                    <option value="JPY" ${evt.currency === 'JPY' ? 'selected' : ''}>JPY (円)</option>
                  </select>
                </div>
                <div class="col-span-2">
                  <label class="block text-[11px] font-bold text-gray-600 mb-1">金額</label>
                  <input id="evt-expense" type="number" value="${evt.expense}" placeholder="例：950" class="w-full border rounded-lg p-2 text-sm bg-white focus:outline-none focus:border-blue-500">
                </div>
              </div>

              <div>
                <label class="block text-[11px] font-bold text-gray-600 mb-1">支払った人</label>
                <select id="evt-paidBy" class="w-full border rounded-lg p-2 text-sm bg-white focus:outline-none focus:border-blue-500">
                  ${memberPaidOptions}
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-bold text-gray-600 mb-1">誰の分を負担したか（対象メンバー）</label>
                <div class="flex flex-wrap gap-1.5">
                  ${memberCheckboxes}
                </div>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">URL</label>
              <input id="evt-url" type="url" value="${evt.url}" placeholder="https://..." class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">メモ</label>
              <textarea id="evt-memo" rows="2" placeholder="持ち物や注意事項など" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:border-blue-500">${evt.memo}</textarea>
            </div>

            <div class="flex gap-2 pt-2 border-t">
              ${eventId ? `<button onclick="deleteEvent('${evt.id}')" class="bg-red-50 text-red-600 font-bold px-3 py-2 rounded-lg text-xs hover:bg-red-100">削除</button>` : ''}
              <button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-600 font-bold py-2 rounded-lg text-xs">キャンセル</button>
              <button onclick="saveEvent('${evt.id}')" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg text-xs hover:bg-blue-700">保存する</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modal-container').innerHTML = html;
    }

    function saveEvent(eventId) {
      const title = document.getElementById('evt-title').value.trim();
      if (!title) {
        alert('スポット名を入力してください！');
        return;
      }

      const trip = getCurrentTrip();
      const currentSchedule = trip.schedule.find(s => s.day === trip.activeDay);
      const existingIndex = currentSchedule.events.findIndex(e => e.id === eventId);

      const selectedForMembers = Array.from(document.querySelectorAll('.evt-for-member-cb:checked')).map(cb => cb.value);

      const eventData = {
        id: eventId,
        title,
        time: document.getElementById('evt-time').value,
        endTime: document.getElementById('evt-end-time').value,
        bookingStatus: document.getElementById('evt-booking').value,
        expense: document.getElementById('evt-expense').value,
        currency: document.getElementById('evt-currency').value,
        paidBy: document.getElementById('evt-paidBy').value,
        forMembers: selectedForMembers,
        url: document.getElementById('evt-url').value.trim(),
        memo: document.getElementById('evt-memo').value.trim()
      };

      if (existingIndex >= 0) {
        currentSchedule.events[existingIndex] = eventData;
      } else {
        currentSchedule.events.push(eventData);
      }

      currentSchedule.events.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

      saveTrips();
      closeModal();
      switchTab('itinerary');
    }

    function deleteEvent(eventId) {
      if (!confirm('この予定を削除してもよろしいですか？')) return;
      const trip = getCurrentTrip();
      const currentSchedule = trip.schedule.find(s => s.day === trip.activeDay);
      currentSchedule.events = currentSchedule.events.filter(e => e.id !== eventId);

      saveTrips();
      closeModal();
      switchTab('itinerary');
    }

    // --- 5. 精算画面（現地通貨・日本円換算 両対応） ---
    function updateExchangeRate(newRate) {
      const trip = getCurrentTrip();
      if (trip) {
        trip.exchangeRate = parseFloat(newRate) || 1;
        saveTrips();
        switchTab('settlement');
      }
    }

    function renderSettlement() {
      const trip = getCurrentTrip();
      if (!trip) return '';

      const members = trip.members || ['自分'];
      const mainCurr = trip.currency || 'JPY';
      const rate = trip.exchangeRate || 1;

      // 通貨ごとの集計オブジェクト
      // { JPY: { total: 0, paid: {m:0}, share: {m:0} }, [mainCurr]: { total: 0, paid: {m:0}, share: {m:0} } }
      const currList = mainCurr === 'JPY' ? ['JPY'] : [mainCurr, 'JPY'];
      
      const stats = {};
      currList.forEach(c => {
        stats[c] = {
          total: 0,
          paid: {},
          share: {}
        };
        members.forEach(m => {
          stats[c].paid[m] = 0;
          stats[c].share[m] = 0;
        });
      });

      // 旅程データから集計
      trip.schedule.forEach(s => {
        s.events.forEach(e => {
          if (e.expense) {
            const amt = Number(e.expense);
            const c = e.currency || mainCurr;

            if (!stats[c]) {
              stats[c] = { total: 0, paid: {}, share: {} };
              members.forEach(m => { stats[c].paid[m] = 0; stats[c].share[m] = 0; });
            }

            stats[c].total += amt;

            if (e.paidBy && stats[c].paid[e.paidBy] !== undefined) {
              stats[c].paid[e.paidBy] += amt;
            }

            const targetMembers = e.forMembers && e.forMembers.length > 0 ? e.forMembers : members;
            const splitAmt = amt / targetMembers.length;
            targetMembers.forEach(tm => {
              if (stats[c].share[tm] !== undefined) {
                stats[c].share[tm] += splitAmt;
              }
            });
          }
        });
      });

      // 各メンバーの「通貨別収支」と「円換算合計収支」を計算
      const memberDetailsHTML = members.map(m => {
        let diffJpyTotal = 0;
        let currencyBreakdownHTML = '';

        currList.forEach(c => {
          const paid = stats[c].paid[m] || 0;
          const share = stats[c].share[m] || 0;
          const diff = paid - share;

          // 円換算加算
          const rateMultiplier = (c === 'JPY') ? 1 : rate;
          diffJpyTotal += (diff * rateMultiplier);

          if (paid > 0 || share > 0) {
            const diffSign = diff > 0 ? `＋${c} ${Math.round(diff).toLocaleString()}` : (diff < 0 ? `－${c} ${Math.abs(Math.round(diff)).toLocaleString()}` : `${c} 0`);
            const diffColor = diff > 0 ? 'text-green-600' : (diff < 0 ? 'text-red-600' : 'text-gray-500');

            currencyBreakdownHTML += `
              <div class="text-[11px] text-gray-600 flex justify-between items-center border-t border-gray-100 pt-1 mt-1">
                <span><b>${c}</b> (立替: ${Math.round(paid)} / 負担: ${Math.round(share)})</span>
                <span class="font-bold ${diffColor}">${diffSign}</span>
              </div>
            `;
          }
        });

        let finalBadge = '';
        if (Math.round(diffJpyTotal) > 0) {
          finalBadge = `<span class="text-xs font-bold text-green-700 bg-green-100 px-2.5 py-1 rounded-full">最終: ＋¥${Math.round(diffJpyTotal).toLocaleString()} (受取)</span>`;
        } else if (Math.round(diffJpyTotal) < 0) {
          finalBadge = `<span class="text-xs font-bold text-red-700 bg-red-100 px-2.5 py-1 rounded-full">最終: －¥${Math.abs(Math.round(diffJpyTotal)).toLocaleString()} (支払)</span>`;
        } else {
          finalBadge = `<span class="text-xs font-bold text-gray-500 bg-gray-100 px-2.5 py-1 rounded-full">最終: ¥0 (清算なし)</span>`;
        }

        return `
          <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm space-y-1.5">
            <div class="flex justify-between items-center border-b pb-1.5">
              <span class="font-bold text-gray-800 text-sm">👤 ${m}</span>
              ${finalBadge}
            </div>
            ${currencyBreakdownHTML || '<p class="text-[11px] text-gray-400">登録された費用はありません</p>'}
          </div>
        `;
      }).join('');

      // レート調整エリア
      const rateSettingHTML = mainCurr !== 'JPY' ? `
        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-3 flex justify-between items-center text-xs">
          <div>
            <span class="font-bold text-yellow-900 block">💱 為替レート設定</span>
            <span class="text-[11px] text-yellow-700">1 ${mainCurr} ＝ 何円で計算する？</span>
          </div>
          <div class="flex items-center gap-1">
            <input type="number" step="0.1" value="${rate}" onchange="updateExchangeRate(this.value)" class="w-16 border rounded p-1 text-center text-sm font-bold bg-white focus:outline-none focus:border-blue-500">
            <span class="font-bold text-yellow-900">円</span>
          </div>
        </div>
      ` : '';

      return `
        <div class="space-y-4">
          <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 rounded-xl shadow">
            <p class="text-xs text-blue-100">旅程に登録された総費用（円換算合計）</p>
            <p class="text-2xl font-bold mt-0.5">約 ¥${Math.round((stats[mainCurr]?.total || 0) * rate + (stats['JPY']?.total || 0)).toLocaleString()}</p>
            <div class="text-[11px] text-blue-100 mt-2 flex gap-3 border-t border-blue-400/50 pt-1.5">
              ${mainCurr !== 'JPY' ? `<span>${mainCurr}: <b>${(stats[mainCurr]?.total || 0).toLocaleString()}</b></span>` : ''}
              <span>JPY: <b>¥${(stats['JPY']?.total || 0).toLocaleString()}</b></span>
            </div>
          </div>

          ${rateSettingHTML}

          <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">メンバー別 精算バランス</h3>
          <div class="space-y-2.5">
            ${memberDetailsHTML}
          </div>
        </div>`;
    }

    // --- 6. AI相談画面 ---
    function renderAI() {
      const trip = getCurrentTrip();
      if (!trip) return '';

      if (!trip.chatHistory) {
        trip.chatHistory = [{ sender: 'ai', text: 'こんにちは！旅行特化AIです。何でもご相談ください！' }];
      }

      let chatLogs = trip.chatHistory.map(msg => {
        if (msg.sender === 'user') {
          return `<div class="flex justify-end mb-3"><div class="bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none text-xs max-w-[80%]">${msg.text}</div></div>`;
        } else {
          return `
            <div class="flex justify-start mb-3 gap-2">
              <div class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xs font-bold shrink-0">AI</div>
              <div class="bg-white border p-3 rounded-2xl rounded-tl-none text-xs max-w-[85%] shadow-sm text-gray-800 whitespace-pre-wrap">${msg.text}</div>
            </div>`;
        }
      }).join('');

      return `
        <div class="flex flex-col h-[calc(100vh-140px)]">
          <div class="bg-blue-50 border border-blue-200 rounded-xl p-2.5 mb-3 flex items-center gap-2">
            <i data-lucide="sparkles" class="w-4 h-4 text-blue-600 shrink-0"></i>
            <p class="text-[11px] text-blue-800 leading-tight">現在AI機能はデモモードです。</p>
          </div>

          <div class="flex-1 overflow-y-auto pr-1" id="chat-box">
            ${chatLogs}
          </div>
          <div class="mt-2 flex gap-2">
            <input id="ai-input" type="text" placeholder="おすすめのランチ教えて！など" class="flex-1 border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
            <button onclick="sendAIMessage()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold shrink-0">送信</button>
          </div>
        </div>
      `;
    }

    function sendAIMessage() {
      const input = document.getElementById('ai-input');
      const val = input.value.trim();
      if (!val) return;

      const trip = getCurrentTrip();
      if (!trip.chatHistory) trip.chatHistory = [];

      trip.chatHistory.push({ sender: 'user', text: val });
      
      setTimeout(() => {
        const dummyReply = `「${val}」ですね！\n「${trip.title}」（${trip.destination}）の旅程に合わせて提案します！`;
        trip.chatHistory.push({ sender: 'ai', text: dummyReply });
        saveTrips();
        switchTab('ai');
      }, 400);

      saveTrips();
      switchTab('ai');
    }

    // --- 7. 持ち物画面 ---
    function renderBelongings() {
      const trip = getCurrentTrip();
      if (!trip) return '';

      return `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-sm font-bold text-gray-700">持ち物チェックリスト</h2>
          </div>
          <div class="space-y-2">
            ${trip.belongings.map(b => `
              <label class="flex items-center justify-between text-sm p-2 hover:bg-gray-50 rounded border-b border-gray-50 last:border-none">
                <div class="flex items-center gap-2">
                  <input type="checkbox" ${b.checked ? 'checked' : ''} onchange="toggleBelonging(${b.id})" class="w-4 h-4 text-blue-600 rounded">
                  <span class="${b.checked ? 'line-through text-gray-400' : 'text-gray-700'}">${b.item}</span>
                </div>
              </label>
            `).join('')}
          </div>
          <button onclick="addBelongingPrompt()" class="mt-3 w-full py-2 text-xs text-blue-600 font-bold bg-blue-50 rounded-lg hover:bg-blue-100">+ 持ち物を追加</button>
        </div>`;
    }

    function toggleBelonging(id) {
      const trip = getCurrentTrip();
      const item = trip.belongings.find(b => b.id === id);
      if (item) {
        item.checked = !item.checked;
        saveTrips();
        switchTab('belongings');
      }
    }

    function addBelongingPrompt() {
      const item = prompt("追加する持ち物名");
      if (!item) return;
      const trip = getCurrentTrip();
      trip.belongings.push({ id: Date.now(), item, checked: false });
      saveTrips();
      switchTab('belongings');
    }

    // --- タブ切り替え ---
    const views = {
      home: renderHome,
      itinerary: renderItinerary,
      belongings: renderBelongings,
      settlement: renderSettlement,
      ai: renderAI,
      trips: renderTrips
    };

    function switchTab(tabName) {
      updateHeader();
      document.getElementById('app-content').innerHTML = views[tabName]();
      
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('text-blue-600');
        btn.classList.add('text-gray-400');
      });

      const activeTabBtn = document.getElementById(`tab-${tabName}`);
      if (activeTabBtn) {
        activeTabBtn.classList.remove('text-gray-400');
        activeTabBtn.classList.add('text-blue-600');
      }

      lucide.createIcons();
    }

    switchTab('home');
  </script>
</body>
</html>
