<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabiori × walica AI Travel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-24">

  <!-- ヘッダー -->
  <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold">別府温泉＆高千穂 3日間の旅</h1>
        <p class="text-xs text-blue-100">レンタカー移動ルート（3名）</p>
      </div>
      <div class="flex -space-x-2">
        <div class="w-8 h-8 rounded-full bg-yellow-400 border-2 border-white flex items-center justify-center text-xs font-bold text-gray-800">た</div>
        <div class="w-8 h-8 rounded-full bg-green-400 border-2 border-white flex items-center justify-center text-xs font-bold text-gray-800">は</div>
        <div class="w-8 h-8 rounded-full bg-purple-400 border-2 border-white flex items-center justify-center text-xs font-bold text-gray-800">じ</div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ表示エリア -->
  <main id="app-content" class="p-4 max-w-md mx-auto">
    <!-- JSで切り替えます -->
  </main>

  <!-- 下部タブバー -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 max-w-md mx-auto z-20">
    <button onclick="switchTab('home')" class="tab-btn flex flex-col items-center text-blue-600" id="tab-home">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-xs mt-1">ホーム</span>
    </button>
    <button onclick="switchTab('itinerary')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-itinerary">
      <i data-lucide="calendar" class="w-5 h-5"></i>
      <span class="text-xs mt-1">旅程</span>
    </button>
    <button onclick="switchTab('belongings')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-belongings">
      <i data-lucide="check-square" class="w-5 h-5"></i>
      <span class="text-xs mt-1">持ち物</span>
    </button>
    <button onclick="switchTab('settlement')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-settlement">
      <i data-lucide="japanese-yen" class="w-5 h-5"></i>
      <span class="text-xs mt-1">精算</span>
    </button>
    <button onclick="switchTab('ai')" class="tab-btn flex flex-col items-center text-gray-400" id="tab-ai">
      <i data-lucide="sparkles" class="w-5 h-5"></i>
      <span class="text-xs mt-1">AI相談</span>
    </button>
  </nav>

  <script>
    const tripData = {
      members: ["たろう", "はなこ", "じろう"],
      activeDay: 1,
      schedule: [
        {
          day: 1,
          date: "1日目 (別府)",
          events: [
            {
              id: "evt_101",
              time: "11:00",
              title: "別府地獄めぐり",
              transport: "🚗 大分空港からレンタカー45分",
              memo: "海地獄・血の池地獄を巡る定番ルート",
              location: "大分県別府市鉄輪",
              bookingStatus: "unnecessary",
              mapUrl: "https://maps.google.com/?q=別府地獄めぐり",
              expense: { amount: 6000, paidBy: "たろう", splitWith: ["たろう", "はなこ", "じろう"] }
            }
          ]
        },
        {
          day: 2,
          date: "2日目 (高千穂)",
          events: [
            {
              id: "evt_201",
              time: "20:00",
              title: "高千穂神社 夜神楽鑑賞",
              transport: "🚗 別府からやまなみハイウェイ経由で約2時間15分",
              memo: "毎日20:00〜開催。事前ネット予約推奨",
              location: "宮崎県西臼杵郡高千穂町三田井1037",
              bookingStatus: "reserved",
              mapUrl: "https://maps.google.com/?q=高千穂神社",
              expense: { amount: 3000, paidBy: "はなこ", splitWith: ["たろう", "はなこ", "じろう"] }
            }
          ]
        },
        {
          day: 3,
          date: "3日目 (高千穂峡)",
          events: [
            {
              id: "evt_301",
              time: "08:30",
              title: "高千穂峡 貸しボート体験",
              transport: "🚗 宿泊施設から車で10分",
              memo: "要事前予約（1週間前から受付）。真名井の滝を間近で鑑賞",
              location: "宮崎県西臼杵郡高千穂町向山",
              bookingStatus: "unreserved",
              mapUrl: "https://maps.google.com/?q=高千穂峡貸しボート",
              expense: null
            }
          ]
        }
      ],
      belongings: [
        { id: 1, item: "運転免許証（レンタカー用）", checked: true, assignedTo: "全員" },
        { id: 2, item: "羽織るもの（夜神楽鑑賞用）", checked: false, assignedTo: "全員" }
      ],
      chatHistory: [
        { sender: 'ai', text: 'こんにちは！旅行特化AIです。現在の旅程「別府〜高千穂」の相談や、阿蘇などの経由地追加など何でも聞いてください！' }
      ]
    };

    function renderHome() {
      return `
        <div class="space-y-4">
          <div class="bg-blue-50 border border-blue-200 rounded-xl p-4">
            <p class="text-xs text-blue-600 font-semibold">次の旅行</p>
            <h2 class="text-xl font-bold text-gray-800">別府温泉＆高千穂 3日間の旅</h2>
            <p class="text-xs text-gray-500 mt-1">温泉と神話の里を巡る絶景ドライブ旅</p>
            <div class="mt-3 flex gap-2">
              <button onclick="switchTab('itinerary')" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold">旅程を見る</button>
              <button onclick="switchTab('settlement')" class="bg-white border text-gray-700 text-xs px-3 py-1.5 rounded-lg font-bold">精算状況</button>
            </div>
          </div>
        </div>`;
    }

    function getBookingBadge(status, evtId) {
      if (status === 'reserved') {
        return `<button onclick="toggleBooking('${evtId}')" class="text-[10px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded border border-green-300">✅ 予約済み</button>`;
      } else if (status === 'unreserved') {
        return `<button onclick="toggleBooking('${evtId}')" class="text-[10px] bg-red-100 text-red-600 font-bold px-2 py-0.5 rounded border border-red-300 animate-pulse">⚠️ 予約未完了</button>`;
      } else {
        return `<span class="text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded">予約不要</span>`;
      }
    }

    function toggleBooking(evtId) {
      tripData.schedule.forEach(s => {
        s.events.forEach(e => {
          if (e.id === evtId) {
            e.bookingStatus = e.bookingStatus === 'reserved' ? 'unreserved' : 'reserved';
          }
        });
      });
      switchTab('itinerary');
    }

    function renderItinerary() {
      let dayTabsHTML = `<div class="flex space-x-2 mb-4 overflow-x-auto pb-1">`;
      tripData.schedule.forEach(s => {
        const activeClass = s.day === tripData.activeDay ? "bg-blue-600 text-white" : "bg-white text-gray-600 border";
        dayTabsHTML += `<button onclick="changeDay(${s.day})" class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap shadow-sm ${activeClass}">Day ${s.day} (${s.date})</button>`;
      });
      dayTabsHTML += `</div>`;

      const currentSchedule = tripData.schedule.find(s => s.day === tripData.activeDay);
      let eventsHTML = `<div class="space-y-4">`;

      if (!currentSchedule || currentSchedule.events.length === 0) {
        eventsHTML += `<div class="text-center py-8 text-gray-400 text-sm">予定がありません。</div>`;
      } else {
        currentSchedule.events.forEach(evt => {
          let expenseBadge = evt.expense 
            ? `<div class="mt-2 text-xs bg-green-50 text-green-700 p-2 rounded border border-green-200 flex justify-between items-center">
                 <span>💰 立替: <b>¥${evt.expense.amount.toLocaleString()}</b> (${evt.expense.paidBy})</span>
                 <span class="text-gray-500">対象: ${evt.expense.splitWith.length}名</span>
               </div>`
            : `<button onclick="addExpense('${evt.id}')" class="mt-2 text-xs text-blue-600 hover:underline flex items-center gap-1">
                 <i data-lucide="plus-circle" class="w-3 h-3"></i> 📸 レシート/立替を追加
               </button>`;

          eventsHTML += `
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
              <div class="flex justify-between items-center mb-1">
                <span class="text-sm font-bold text-blue-600">${evt.time}</span>
                ${getBookingBadge(evt.bookingStatus, evt.id)}
              </div>
              <h3 class="font-bold text-gray-800 text-base">${evt.title}</h3>
              ${evt.transport ? `<p class="text-xs text-indigo-600 bg-indigo-50 px-2 py-1 rounded mt-1.5 inline-block font-medium">${evt.transport}</p>` : ''}
              ${evt.memo ? `<p class="text-xs text-gray-600 mt-1.5">${evt.memo}</p>` : ''}
              ${evt.location ? `
                <a href="${evt.mapUrl}" target="_blank" class="text-xs text-blue-500 mt-1 flex items-center gap-1 hover:underline">
                  <i data-lucide="map-pin" class="w-3 h-3"></i> ${evt.location} （マップを開く）
                </a>` : ''}
              ${expenseBadge}
            </div>`;
        });
      }
      eventsHTML += `</div>`;

      return dayTabsHTML + eventsHTML;
    }

    function renderAI() {
      const savedKey = localStorage.getItem('gemini_api_key') || '';

      let chatLogs = tripData.chatHistory.map(msg => {
        if (msg.sender === 'user') {
          return `<div class="flex justify-end mb-3"><div class="bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none text-xs max-w-[80%]">${msg.text}</div></div>`;
        } else {
          return `
            <div class="flex justify-start mb-3 gap-2">
              <div class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xs font-bold shrink-0">AI</div>
              <div class="bg-white border p-3 rounded-2xl rounded-tl-none text-xs max-w-[85%] shadow-sm text-gray-800 whitespace-pre-wrap">${msg.text}</div>
            </div>`;
        }
      }).join('');

      return `
        <div class="flex flex-col h-[calc(100vh-140px)]">
          <!-- APIキー設定エリア -->
          <div class="mb-3 p-3 bg-gray-50 border rounded-xl">
            <div class="flex justify-between items-center mb-1">
              <label class="text-[10px] text-gray-500 font-bold">Gemini API Key 設定</label>
              <button onclick="saveApiKey()" class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded font-bold">保存</button>
            </div>
            <input id="api-key-input" type="password" value="${savedKey}" placeholder="APIキーを入力（アプリにのみ保存）" class="w-full border rounded px-2 py-1 text-xs focus:outline-none">
          </div>

          <div class="flex-1 overflow-y-auto pr-1" id="chat-box">
            ${chatLogs}
          </div>
          <div class="mt-2 flex gap-2">
            <input id="ai-input" type="text" placeholder="阿蘇に寄るルートにして！など" class="flex-1 border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
            <button onclick="sendAIMessage()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">送信</button>
          </div>
        </div>
      `;
    }

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      localStorage.setItem('gemini_api_key', key);
      alert('APIキーを保存しました！');
    }

    async function sendAIMessage() {
      const input = document.getElementById('ai-input');
      const val = input.value.trim();
      if (!val) return;

      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('api-key-input').value.trim();
      if (!apiKey) {
        alert('APIキーを入力して「保存」を押してください！');
        return;
      }
      localStorage.setItem('gemini_api_key', apiKey);

      tripData.chatHistory.push({ sender: 'user', text: val });
      tripData.chatHistory.push({ sender: 'ai', text: '考え中...' });
      switchTab('ai');

      const systemPrompt = `あなたは旅行専門の超優秀な旅程プランナーAIです。
回答は必ず以下のJSON形式のみで出力してください（Markdownの記法や余計な解説文は含めないでください）。

{
  "reply": "ユーザーへの回答メッセージ（移動手段、所要時間、おすすめスポット等）",
  "suggestedBelongings": ["追加すべき持ち物1", "追加すべき持ち物2"]
}

※suggestedBelongingsには、この会話や目的地で必要になりそうな持ち物（例: 海外ならパスポート、温泉ならフェイスタオル、ドライブならETCカード、寒冷地なら羽織るものなど）を配列形式で抽出してください。特に新しい持ち物が必要ない場合は空配列 [] にしてください。`;

      const fullPrompt = `${systemPrompt}\n\n現在の旅程データ: ${JSON.stringify(tripData.schedule)}\n\nユーザーの要望: ${val}`;

      try {
        // v1 エンドポイントに修正して互換性を確保
        const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: fullPrompt }] }]
          })
        });

        const data = await response.json();
        if (data.error) {
          throw new Error(data.error.message);
        }

        const rawText = data.candidates[0].content.parts[0].text;
        
        // JSON解析
        let cleanJsonText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(cleanJsonText);

        // チャットログにAIの回答を反映
        tripData.chatHistory[tripData.chatHistory.length - 1].text = parsed.reply;

        // 持ち物の自動追加処理
        if (parsed.suggestedBelongings && parsed.suggestedBelongings.length > 0) {
          let addedCount = 0;
          parsed.suggestedBelongings.forEach(itemStr => {
            const exists = tripData.belongings.some(b => b.item.includes(itemStr) || itemStr.includes(b.item));
            if (!exists) {
              tripData.belongings.push({
                id: Date.now() + Math.random(),
                item: itemStr,
                checked: false,
                assignedTo: "🤖 AI提案"
              });
              addedCount++;
            }
          });

          if (addedCount > 0) {
            tripData.chatHistory[tripData.chatHistory.length - 1].text += `\n\n💡 **持ち物リストに ${addedCount} 件のアイテムを自動追加しました！** （持ち物タブで確認できます）`;
          }
        }

      } catch (error) {
        tripData.chatHistory[tripData.chatHistory.length - 1].text = `エラーが発生しました:\n${error.message}\n\n※APIキーをご確認いただくか、Google AI Studioで新しく生成したキーをお試しください。`;
      }

      switchTab('ai');
    }

    function renderSettlement() {
      let totalAmount = 0;
      const paidMap = { "たろう": 0, "はなこ": 0, "じろう": 0 };
      const balanceMap = { "たろう": 0, "はなこ": 0, "じろう": 0 };

      tripData.schedule.forEach(s => {
        s.events.forEach(e => {
          if (e.expense) {
            totalAmount += e.expense.amount;
            paidMap[e.expense.paidBy] += e.expense.amount;
            
            const splitAmount = e.expense.amount / e.expense.splitWith.length;
            e.expense.splitWith.forEach(m => {
              balanceMap[m] -= splitAmount;
            });
            balanceMap[e.expense.paidBy] += e.expense.amount;
          }
        });
      });

      return `
        <div class="space-y-4">
          <div class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white p-4 rounded-xl shadow">
            <p class="text-xs text-blue-100">旅行全体の総支出</p>
            <p class="text-2xl font-bold mt-1">¥${totalAmount.toLocaleString()}</p>
          </div>
          <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h3 class="text-sm font-bold text-gray-700 mb-3">🔄 清算ルート (walica方式)</h3>
            <div class="bg-yellow-50 p-3 rounded-lg border border-yellow-200 text-xs text-yellow-800">
              <p class="font-bold">じろう ➔ たろう へ ¥2,000</p>
              <p class="font-bold mt-1">じろう ➔ はなこ へ ¥1,000</p>
            </div>
          </div>
        </div>`;
    }

    function renderBelongings() {
      return `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-sm font-bold text-gray-700">持ち物チェックリスト</h2>
            <span class="text-xs text-blue-600 bg-blue-50 px-2 py-0.5 rounded font-semibold">AI自動判定あり</span>
          </div>
          <div class="space-y-3">
            ${tripData.belongings.map(b => `
              <label class="flex items-center justify-between text-sm p-2 hover:bg-gray-50 rounded border-b border-gray-50 last:border-none">
                <div class="flex items-center gap-2">
                  <input type="checkbox" ${b.checked ? 'checked' : ''} onchange="toggleBelonging(${b.id})" class="w-4 h-4 text-blue-600 rounded">
                  <span class="${b.checked ? 'line-through text-gray-400' : 'text-gray-700'}">${b.item}</span>
                </div>
                <span class="text-xs ${b.assignedTo === '🤖 AI提案' ? 'bg-purple-100 text-purple-700 font-bold' : 'bg-gray-100 text-gray-500'} px-2 py-0.5 rounded">${b.assignedTo}</span>
              </label>
            `).join('')}
          </div>
        </div>`;
    }

    function toggleBelonging(id) {
      const item = tripData.belongings.find(b => b.id === id);
      if (item) {
        item.checked = !item.checked;
        switchTab('belongings');
      }
    }

    const views = {
      home: renderHome,
      itinerary: renderItinerary,
      belongings: renderBelongings,
      settlement: renderSettlement,
      ai: renderAI
    };

    function switchTab(tabName) {
      document.getElementById('app-content').innerHTML = views[tabName]();
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('text-blue-600');
        btn.classList.add('text-gray-400');
      });
      document.getElementById(`tab-${tabName}`).classList.remove('text-gray-400');
      document.getElementById(`tab-${tabName}`).classList.add('text-blue-600');
      lucide.createIcons();
    }

    function changeDay(day) {
      tripData.activeDay = day;
      switchTab('itinerary');
    }

    function addExpense(evtId) {
      alert("📸 ここでカメラ起動 / レシート画像読み取りダイアログを開きます！");
    }

    switchTab('home');
  </script>
</body>
</html>
